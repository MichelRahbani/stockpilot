<!DOCTYPE html>
<html lang="en">
<head>

<style>
.seg{display:inline-flex;border:1px solid var(--g200);border-radius:6px;overflow:hidden;margin-bottom:14px}
.seg button{border:0;background:#fff;padding:9px 16px;font:600 14px inherit;cursor:pointer;color:var(--g600)}
.seg button.on{background:#eab308;color:#1c1917}
.kp{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:14px}
.k{border:1px solid var(--g100);border-radius:8px;padding:10px 12px;background:#fff}.k span{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--g400);font-weight:700}.k b{display:block;font-size:22px;margin-top:2px}.k.hl{background:var(--hl)}
.rk{display:grid;grid-template-columns:1.6fr .8fr .9fr 1fr;gap:10px;align-items:end;border:1px solid var(--g100);border-radius:8px;background:#fff;padding:10px 12px;margin-bottom:10px}
.rk .more{grid-column:1 / -1;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;align-items:end}
.rk .out{grid-column:1 / -1;font-size:13px;color:var(--g600);display:flex;gap:16px;flex-wrap:wrap;align-items:center;border-top:1px solid var(--g100);padding-top:8px}
.rk .out b{color:var(--g900)}.rk .more p{font-size:13px;color:#475569;margin:0 0 8px}
.rk .del{margin-left:auto;border:0;background:none;color:var(--g400);cursor:pointer;font-size:13px;text-decoration:underline}
.num{display:inline-flex;width:22px;height:22px;border-radius:50%;background:#ca8a04;color:#1c1917;font-size:12px;font-weight:700;align-items:center;justify-content:center}
.two{display:grid;grid-template-columns:1fr 340px;gap:16px;align-items:start}
.heat{display:grid;grid-template-columns:repeat(5,1fr);gap:3px}
.heat div{aspect-ratio:1;border-radius:4px;display:flex;flex-wrap:wrap;gap:2px;align-items:center;justify-content:center;padding:2px;font-size:10px}
.axis{display:flex;justify-content:space-between;font-size:11px;color:var(--g400);margin-top:6px}
.win{color:#047857;font-weight:700}.lose{color:var(--red);font-weight:700}
.sx{display:grid;grid-template-columns:320px 1fr;gap:16px;align-items:start}
.chk{display:flex;gap:8px;align-items:flex-start;margin-bottom:8px;font-size:14px}.chk input{margin-top:3px;accent-color:#ca8a04}.chk small{display:block;color:var(--g400);font-size:12px}
.shock{display:flex;justify-content:space-between;gap:8px;align-items:center;border:1px solid var(--g100);border-radius:6px;padding:6px 10px;margin-bottom:6px;font-size:13px;background:#fff}
.shock button{border:0;background:none;color:var(--g400);cursor:pointer;font-size:18px}
svg.ch{width:100%;height:auto;display:block}
.legend{display:flex;gap:16px;font-size:12px;color:var(--g600);margin-top:6px;flex-wrap:wrap}.legend i{display:inline-block;width:18px;height:3px;vertical-align:middle;margin-right:6px}
@media(max-width:900px){.two,.sx{grid-template-columns:1fr}.kp{grid-template-columns:repeat(2,minmax(0,1fr))}.rk{grid-template-columns:1fr 1fr}.rk .more{grid-template-columns:1fr 1fr}}
.inl{display:grid;grid-template-columns:320px 1fr;gap:16px;align-items:start}@media(max-width:900px){.inl{grid-template-columns:1fr}}.bar{display:flex;align-items:center;gap:10px;margin:6px 0;font-size:13px}.bar i{display:block;height:18px;background:#fde68a;border-radius:3px}.bar i.bn{background:#dc2626}.bar span{min-width:92px}.stp{display:grid;grid-template-columns:1fr 100px;gap:8px;margin-bottom:8px}</style><link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:ital,wght@0,400..800;1,400..600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>

<link rel="stylesheet" href="/sp-app.css"/>
<link rel="stylesheet" href="/biz-shell.css?v=1"/>
<script>window.BIZ_PAGE={tab:'labs',title:'Operations Lab',sub:'Find your break-even point, spot the bottleneck, and know when to reorder stock.'};</script>

</head>
<body>
<nav class="top">
  <a href="/" class="logo"><img src="/logo-mark-256.png" class="sp-mark" alt="StockPilot" width="30" height="30"><span class="logo-text">StockPilot</span></a>
  <div class="nav-links">
    <a href="/budget-workspace.html#supply" class="nav-link">Supply Chain</a>
    <a href="/investing" class="nav-link">Investing</a>
    <a href="/budget" class="nav-link">Budget</a>
    <a href="/trade" class="nav-link">Virtual Market</a>
  </div>
</nav>
<div class="wrap">
  <div class="seg"><button id="t1" class="on" type="button">Break-even</button><button id="t2" type="button">Capacity</button><button id="t3" type="button">Reorder point</button></div>
  <div id="p1"><div class="inl"><section class="card"><h2>Your numbers</h2><label class="f" style="margin-bottom:8px">Fixed costs a month ($)<input type="number" id="fx" value="2000" ></label><label class="f" style="margin-bottom:8px">Price per unit ($)<input type="number" id="pr" value="12" ></label><label class="f" style="margin-bottom:8px">Variable cost per unit ($)<input type="number" id="vc" value="4" ></label><label class="f" style="margin-bottom:8px">Units you expect to sell<input type="number" id="ex" value="400" ></label></section><div><div class="kp" id="k1"></div><section class="card"><h2>Sales and costs by units sold</h2><div id="c1"></div><div class="legend"><span><i style="background:#ca8a04"></i>Sales</span><span><i style="background:#94a3b8"></i>Total costs</span></div><ul class="ins" id="i1" style="margin:12px 0 0 18px"></ul></section></div></div></div>
  <div id="p2" hidden><div class="inl"><section class="card"><h2>Steps in the process</h2><div id="steps"></div><button class="btn ghost" id="addStep" type="button">Add a step</button><h2 style="margin-top:16px">What if you speed up one step by 25%?</h2><select id="sp" style="width:100%"></select></section><div><div class="kp" id="k2"></div><section class="card"><h2>Units per hour, by step</h2><div id="bars"></div><ul class="ins" id="i2" style="margin:12px 0 0 18px"></ul></section></div></div></div>
  <div id="p3" hidden><div class="inl"><section class="card"><h2>Your stock</h2><label class="f" style="margin-bottom:8px">Units sold per day<input type="number" id="dd" value="20" ></label><label class="f" style="margin-bottom:8px">Days for a delivery to arrive<input type="number" id="lt" value="2" ></label><label class="f" style="margin-bottom:8px">Safety stock (units)<input type="number" id="ss" value="10" ></label><label class="f" style="margin-bottom:8px">Order size (units)<input type="number" id="oq" value="100" ></label><label class="f" style="margin-bottom:8px">Starting stock (units)<input type="number" id="st0" value="80" ></label></section><div><div class="kp" id="k3"></div><section class="card"><h2>Stock over 30 days</h2><div id="c3"></div><div class="legend"><span><i style="background:#ca8a04"></i>Units in stock</span><span><i style="background:#dc2626"></i>Zero</span></div><ul class="ins" id="i3" style="margin:12px 0 0 18px"></ul></section></div></div></div>
</div>
<script>
(function(){
  'use strict';
  var $=function(i){return document.getElementById(i)};
  function money(n){var s=Math.abs(Math.round(n)).toLocaleString('en-US');return (n<0?'-$':'$')+s;}
  function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e;}

  var NS='http://www.w3.org/2000/svg';
  function chart(host,series,opts){
    opts=opts||{};var W=640,H=250,pad=52,all=[];series.forEach(function(s){s.v.forEach(function(p){all.push(p.y);});});
    var mn=Math.min.apply(null,all.concat([0])),mx=Math.max.apply(null,all);if(mx===mn)mx=mn+1;
    var xs=[];series.forEach(function(s){s.v.forEach(function(p){xs.push(p.x);});});var x0=Math.min.apply(null,xs),x1=Math.max.apply(null,xs);if(x1===x0)x1=x0+1;
    var X=function(v){return pad+(W-pad-12)*(v-x0)/(x1-x0);},Y=function(v){return 10+(H-34)*(1-(v-mn)/(mx-mn));};
    var svg=document.createElementNS(NS,'svg');svg.setAttribute('viewBox','0 0 '+W+' '+H);svg.setAttribute('class','ch');
    function mk(n,a){var e=document.createElementNS(NS,n);for(var k in a)e.setAttribute(k,a[k]);svg.appendChild(e);return e;}
    mk('line',{x1:pad,x2:W-12,y1:Y(0),y2:Y(0),stroke:'#dc2626','stroke-width':1.2});
    series.forEach(function(s){mk('path',{d:s.v.map(function(p,i){return (i?'L':'M')+X(p.x)+' '+Y(p.y);}).join(' '),fill:'none',stroke:s.c,'stroke-width':3,'stroke-dasharray':s.d||''});});
    [mn,0,mx].forEach(function(v){var t=mk('text',{x:pad-6,y:Y(v)+4,'text-anchor':'end','font-size':11,fill:'#64748b'});t.textContent=opts.fmt?opts.fmt(v):Math.round(v);});
    [x0,(x0+x1)/2,x1].forEach(function(v){var t=mk('text',{x:X(v),y:H-8,'text-anchor':'middle','font-size':11,fill:'#64748b'});t.textContent=(opts.xl||'')+Math.round(v);});
    if(opts.mark!=null){mk('line',{x1:X(opts.mark),x2:X(opts.mark),y1:10,y2:H-24,stroke:'#94a3b8','stroke-dasharray':'4 4'});}
    host.textContent='';host.appendChild(svg);
  }
  function kp(host,arr){host.textContent='';arr.forEach(function(x){var k=el('div','k'+(x[2]?' hl':''));k.appendChild(el('span',null,x[0]));k.appendChild(el('b',null,x[1]));host.appendChild(k);});}
  function num(id){return parseFloat(document.getElementById(id).value)||0;}

  var steps=[{n:'Mixing',r:100},{n:'Baking',r:40},{n:'Packing',r:80}];
  function ul(id,arr){var u=$(id);u.textContent='';arr.forEach(function(t){u.appendChild(el('li',null,t));});}
  function r1(){
    var fx=num('fx'),pr=num('pr'),vc=num('vc'),ex=num('ex'),cm=pr-vc,be=cm>0?fx/cm:0;
    var prof=ex*cm-fx,ms=ex>0&&be>0?(ex-be)/ex:0;
    kp($('k1'),[['Break-even units',cm>0?Math.ceil(be)+'':'never',false],['Break-even sales',cm>0?money(be*pr):'-',false],['Profit at '+ex+' units',money(prof),prof<0],['Margin of safety',cm>0?Math.round(ms*100)+'%':'-',false]]);
    var top=Math.max(be*2,ex*1.3,10),a=[],b=[];for(var i=0;i<=12;i++){var u=top*i/12;a.push({x:u,y:u*pr});b.push({x:u,y:fx+u*vc});}
    chart($('c1'),[{v:b,c:'#94a3b8',d:'6 5'},{v:a,c:'#ca8a04'}],{fmt:money,xl:'',mark:cm>0?be:null});
    var t=[];if(cm<=0)t.push('Each unit sells for less than it costs to make, so selling more only loses money. Raise the price or cut the variable cost.');
    else{t.push('Each unit leaves '+money(cm)+' toward your fixed costs. You need '+Math.ceil(be)+' units to cover '+money(fx)+'.');
      t.push(prof>=0?'At '+ex+' units you make '+money(prof)+'. You could sell '+Math.round(ms*100)+'% fewer and still break even.':'At '+ex+' units you lose '+money(-prof)+'. You are short by '+Math.ceil(be-ex)+' units.');}
    ul('i1',t);
  }
  function r2(){
    var host=$('steps');host.textContent='';
    steps.forEach(function(s,i){var d=el('div','stp');var n=el('input');n.type='text';n.value=s.n;n.addEventListener('input',function(){s.n=n.value;r2b();});var r=el('input');r.type='number';r.min=1;r.value=s.r;r.addEventListener('input',function(){s.r=parseFloat(r.value)||1;r2b();});d.appendChild(n);d.appendChild(r);host.appendChild(d);});
    var sp=$('sp'),cur=sp.value||'0';sp.textContent='';steps.forEach(function(s,i){var o=el('option',null,s.n);o.value=i;sp.appendChild(o);});sp.value=cur<steps.length?cur:'0';r2b();
  }
  function r2b(){
    var rates=steps.map(function(s){return s.r;}),out=Math.min.apply(null,rates),bi=rates.indexOf(out),mx=Math.max.apply(null,rates);
    var b=$('bars');b.textContent='';steps.forEach(function(s,i){var d=el('div','bar');d.appendChild(el('span',null,s.n));var x=el('i',i===bi?'bn':'');x.style.width=Math.max(4,Math.round(s.r/mx*100*0.62))+'%';d.appendChild(x);d.appendChild(el('b',null,String(s.r)));b.appendChild(d);});
    var k=parseInt($('sp').value,10)||0,faster=rates.slice();faster[k]=faster[k]*1.25;var out2=Math.min.apply(null,faster);
    kp($('k2'),[['Output per hour',Math.round(out)+'',false],['Bottleneck',steps[bi].n,true],['If you speed up '+steps[k].n+' 25%',Math.round(out2*10)/10+' per hour',false],['Gain',out2>out?'+'+Math.round((out2/out-1)*100)+'%':'none',false]]);
    ul('i2',[steps[bi].n+' is the slowest step, so the whole process makes '+Math.round(out)+' an hour.',out2>out?'Speeding up '+steps[k].n+' adds '+Math.round((out2-out)*10)/10+' units an hour.':'Speeding up '+steps[k].n+' changes nothing. It is not the bottleneck.']);
  }
  $('addStep').addEventListener('click',function(){steps.push({n:'Step '+(steps.length+1),r:60});r2();});
  function r3(){
    var dd=num('dd'),lt=num('lt'),ss=num('ss'),oq=num('oq'),st=num('st0'),rop=dd*lt+ss;
    var pts=[],inbox=[],lost=0,stock=st,orders=0;
    for(var d=0;d<=30;d++){
      for(var j=inbox.length-1;j>=0;j--)if(inbox[j].d===d){stock+=inbox[j].q;inbox.splice(j,1);}
      pts.push({x:d,y:stock});
      var sold=Math.min(stock,dd);lost+=dd-sold;stock-=sold;
      var onway=inbox.reduce(function(a,b){return a+b.q;},0);
      if(stock+onway<=rop&&oq>0){inbox.push({d:d+Math.round(lt),q:oq});orders++;}
    }
    kp($('k3'),[['Reorder point',Math.round(rop)+' units',false],['Orders placed',orders+'',false],['Sales lost to empty shelves',Math.round(lost)+' units',lost>0],['Lowest stock',Math.round(Math.min.apply(null,pts.map(function(p){return p.y;})))+'',false]]);
    chart($('c3'),[{v:pts,c:'#ca8a04'}],{xl:'Day '});
    ul('i3',[ 'Order when stock reaches '+Math.round(rop)+' units: '+dd+' a day for '+lt+' days of waiting, plus '+ss+' as a cushion.',lost>0?'You ran out of stock and lost '+Math.round(lost)+' units of sales. Raise the safety stock or the order size.':'You never ran out. Try lowering the safety stock to free up cash.']);
  }
  ['fx','pr','vc','ex'].forEach(function(i){$(i).addEventListener('input',r1);});
  ['dd','lt','ss','oq','st0'].forEach(function(i){$(i).addEventListener('input',r3);});
  $('sp').addEventListener('change',r2b);
  function tab(n){['1','2','3'].forEach(function(k){$('p'+k).hidden=k!==n;$('t'+k).classList.toggle('on',k===n);});var h={'1':'breakeven','2':'capacity','3':'reorder'}[n];history.replaceState(null,'','#'+h);if(n==='1')r1();if(n==='2')r2();if(n==='3')r3();}
  $('t1').addEventListener('click',function(){tab('1');});$('t2').addEventListener('click',function(){tab('2');});$('t3').addEventListener('click',function(){tab('3');});
  tab(({'#capacity':'2','#reorder':'3'})[location.hash]||'1');
})();
</script>
<script>['/share.js','/cross-promo.js','/nav-fix.js'].forEach(function(s){document.write('<script src="'+s+'"><\/script>');});</script>
<script src="/lang-toggle.js"></script>
</body>
