<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Sports Stock Fantasy League | StockPilot Bullpen</title>
<link rel="icon" type="image/jpeg" href="https://mystockspilot.com/logo.jpg"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--green:#16a34a;--green-l:#f0fdf4;--green-b:#bbf7d0;--red:#dc2626;--red-l:#fef2f2;--blue:#2563eb;--blue-l:#eff6ff;--border:#e5e7eb;--bg:#f9fafb;--white:#fff;--text:#111827;--muted:#6b7280;--gold:#fef9e7;--gold-b:#fde68a}
body{font-family:'DM Sans',-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
nav{background:var(--white);border-bottom:1px solid var(--border);padding:14px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50}
.nav-logo{display:flex;align-items:center;gap:8px;text-decoration:none;font-weight:700;font-size:16px;color:var(--text)}
.nav-logo img{height:28px;width:28px;border-radius:6px}
.badge{background:#dcfce7;color:var(--green);font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px;letter-spacing:.05em}
.btn{padding:8px 16px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;border:none}
.btn-primary{background:var(--green);color:#fff}.btn-primary:disabled{background:#9ca3af}
.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--muted);text-decoration:none;display:inline-block}
.btn-sm{padding:5px 12px;font-size:12px}
.page{max-width:900px;margin:0 auto;padding:24px 20px 80px}
h1{font-size:24px;font-weight:800}
.sub{color:var(--muted);font-size:14px;margin:2px 0 18px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:20px}
.tab{padding:10px 16px;font-size:14px;font-weight:600;color:var(--muted);cursor:pointer;border:none;background:none;border-bottom:2px solid transparent;font-family:inherit}
.tab.active{color:var(--green);border-bottom-color:var(--green)}
.card{background:var(--white);border:1px solid var(--border);border-radius:12px;padding:16px 18px;margin-bottom:12px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:10px 12px;border-bottom:1px solid var(--border)}
td{padding:12px;border-bottom:1px solid var(--border)}
tr.row{cursor:pointer}tr.row:hover{background:var(--bg)}
tr.me td{background:var(--green-l)}
.up{color:var(--green);font-weight:600}.down{color:var(--red);font-weight:600}
.picks{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;padding:6px 0}
.pick{border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-size:13px;background:var(--white)}
.pick .tk{font-weight:800}.pick .pc{font-size:12px}
.muted{color:var(--muted);font-size:13px}
.empty{text-align:center;padding:40px;color:var(--muted)}
textarea{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;font-family:inherit;font-size:14px;resize:vertical;min-height:70px}
input.small{padding:6px 8px;border:1px solid var(--border);border-radius:6px;font-size:13px;font-family:inherit}
.post{background:var(--white);border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:10px}
.post.teacher{border-color:var(--gold-b);background:var(--gold)}
.post-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;font-size:13px}
.post-head .who{font-weight:700}.post-head .when{color:var(--muted);font-size:12px}
.tag{font-size:10px;font-weight:700;background:#fde68a;color:#92400e;padding:1px 7px;border-radius:10px;margin-left:6px}
.post-body{font-size:14px;line-height:1.55;white-space:pre-wrap;word-wrap:break-word}
.actions{display:flex;gap:12px;margin-top:8px;font-size:12px}
.actions a{color:var(--muted);cursor:pointer;text-decoration:none;font-weight:600}.actions a:hover{color:var(--text)}
.replies{margin:10px 0 0 18px;padding-left:12px;border-left:2px solid var(--border)}
.reply{padding:8px 0;border-bottom:1px solid var(--border)}.reply:last-child{border-bottom:none}
.grade-badge{display:inline-block;margin-top:8px;background:var(--green-l);border:1px solid var(--green-b);color:var(--green);font-size:12px;font-weight:600;padding:4px 10px;border-radius:8px}
.grade-box{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:8px;font-size:12px}
.msg{font-size:13px;padding:8px 12px;border-radius:8px;margin-bottom:10px;display:none}
.msg.error{background:var(--red-l);color:var(--red)}

.tabs{overflow-x:auto;white-space:nowrap}
.pill{display:inline-block;padding:4px 11px;border-radius:20px;font-size:12px;font-weight:600;border:1px solid var(--border);background:var(--white);cursor:pointer;color:var(--muted);margin:0 6px 6px 0}
.pill.active{background:var(--text);color:#fff;border-color:var(--text)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.fa-card{border:1px solid var(--border);border-radius:10px;padding:10px 12px;background:var(--white)}
.fa-card .tk{font-weight:800}.fa-card .nm{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fa-card .cost{display:inline-block;margin-top:6px;font-size:11px;background:var(--blue-l);color:var(--blue);padding:2px 8px;border-radius:12px;font-weight:700}
.panel{background:var(--gold);border:1px solid var(--gold-b);border-radius:12px;padding:14px 16px;margin-bottom:12px}
select.small{padding:6px 8px;border:1px solid var(--border);border-radius:6px;font-size:13px;font-family:inherit;background:#fff;max-width:100%}
.stat3{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin-top:10px}
.stat3 .n{font-size:18px;font-weight:800}.stat3 .l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
details.how{margin-top:10px;font-size:13px;color:var(--muted)}details.how summary{cursor:pointer;font-weight:600}
.tr{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 0;border-bottom:1px solid var(--border);font-size:14px}.tr:last-child{border-bottom:none}
.st{font-size:11px;font-weight:700;padding:2px 8px;border-radius:10px;background:#f3f4f6;color:var(--muted)}
.st.accepted{background:var(--green-l);color:var(--green)}.st.declined,.st.cancelled{background:var(--red-l);color:var(--red)}
.ok{display:none;font-size:13px;padding:8px 12px;border-radius:8px;margin-bottom:10px;background:var(--green-l);color:var(--green)}
</style>
</head>
<body>
<nav>
  <a href="/bullpen-sports.html" class="nav-logo"><img src="/logo.jpg" alt=""/>StockPilot <span class="badge">SPORTS FANTASY</span></a>
  <a href="/bullpen-sports.html" class="btn btn-ghost btn-sm">← All Leagues</a>
</nav>

<div class="page">
  <div id="loadingMsg" class="empty">Loading league...</div>
  <div id="hub" style="display:none">
    <h1 id="leagueTitle"></h1>
    <div class="sub" id="leagueSub"></div>
    <div id="recapBanner" style="display:none"></div>
    <div id="globalMsg" class="msg error"></div>
    <div id="globalOk" class="ok"></div>
    <div class="tabs">
      <button class="tab active" id="tabBtnStandings" onclick="showTab('standings')">🏆 Standings</button>
      <button class="tab" id="tabBtnRoster" onclick="showTab('roster')">📋 My Roster</button>
      <button class="tab" id="tabBtnFa" onclick="showTab('fa')">🔎 Free Agents</button>
      <button class="tab" id="tabBtnTrades" onclick="showTab('trades')">🤝 Trades</button>
      <button class="tab" id="tabBtnDiscuss" onclick="showTab('discuss')">💬 Discussion</button>
    </div>

    <div id="paneStandings"></div>
    <div id="paneRoster" style="display:none"></div>
    <div id="paneFa" style="display:none"></div>
    <div id="paneTrades" style="display:none"></div>
    <div id="paneDiscuss" style="display:none">
      <div class="card">
        <textarea id="newPostBody" placeholder="Share a take on the market, defend a pick, or ask the class something..."></textarea>
        <div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px">
          <span class="muted" id="postAs"></span>
          <button class="btn btn-primary" id="postBtn" onclick="submitPost(null)">Post</button>
        </div>
      </div>
      <div id="discussMsg" class="msg error"></div>
      <div id="postsWrap"></div>
    </div>
  </div>
</div>

<script src="/fantasy-core.js"></script>
<script src="/sports-fantasy-core.js"></script>
<script>
const SUPA_URL='https://xkfxofcmrmpazfjviatq.supabase.co';
const SUPA_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhrZnhvZmNtcm1wYXpmanZpYXRxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgzNzE5MDcsImV4cCI6MjA5Mzk0NzkwN30.DiO5Xo-gh-t_gq_IuSiqXlwX6_LIw3YvZgugknz1o_Q';
const BACKEND='https://stockpilot-production-c94f.up.railway.app';

function isExpired(t){try{const p=JSON.parse(atob(t.split('.')[1]));return !p.exp||p.exp*1000<Date.now();}catch(e){return true;}}
async function getFreshToken(){
  const s=localStorage.getItem('supabase_token');
  if(s&&!isExpired(s))return s;
  const rt=localStorage.getItem('supabase_refresh_token');
  if(!rt)return null;
  try{
    const r=await fetch(SUPA_URL+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{apikey:SUPA_KEY,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:rt})});
    if(!r.ok)return null;
    const d=await r.json();if(!d.access_token)return null;
    localStorage.setItem('supabase_token',d.access_token);
    if(d.refresh_token)localStorage.setItem('supabase_refresh_token',d.refresh_token);
    return d.access_token;
  }catch(e){return null;}
}
function getUid(){const t=localStorage.getItem('supabase_token');if(!t)return null;try{return JSON.parse(atob(t.split('.')[1])).sub;}catch(e){return null;}}
async function sbGet(table,qs=''){const r=await fetch(SUPA_URL+'/rest/v1/'+table+(qs?'?'+qs:''),{headers:{apikey:SUPA_KEY,Authorization:'Bearer '+SUPA_KEY}});return r.json();}
async function sbWrite(table,body,method='POST',qs=''){
  const token=await getFreshToken();
  const r=await fetch(SUPA_URL+'/rest/v1/'+table+(qs?'?'+qs:''),{method,headers:{apikey:SUPA_KEY,Authorization:'Bearer '+(token||SUPA_KEY),'Content-Type':'application/json',Prefer:method==='POST'?'return=representation':'return=minimal'},body:body?JSON.stringify(body):undefined});
  if(method==='POST')return r.json();
  return r.ok;
}
function esc(s){const d=document.createElement('div');d.textContent=s==null?'':s;return d.innerHTML;}



const FC = window.FantasyCore;
const $ = id => document.getElementById(id);
async function sbMut(table, method, body, qs){
  const token = await getFreshToken();
  const r = await fetch(SUPA_URL+'/rest/v1/'+table+(qs?'?'+qs:''),{method,headers:{apikey:SUPA_KEY,Authorization:'Bearer '+(token||SUPA_KEY),'Content-Type':'application/json',Prefer:'return=representation'},body:body?JSON.stringify(body):undefined});
  try{ return await r.json(); }catch(e){ return null; }
}
const SECTOR_ABBR={'Information Technology':'TECH','Health Care':'HLTH','Financials':'FIN','Consumer Discretionary':'CD','Communication Services':'COMM','Industrials':'IND','Consumer Staples':'CS','Energy':'ENGY','Utilities':'UTIL','Real Estate':'RE','Materials':'MATL'};
const POPULAR=FC.TICKERS.slice(0,16);

let uid=null,league=null,isCommissioner=false,myNick='Player';
let rosters=[],trades=[],posts=[],expanded=new Set();
let market={priceMap:{},spyNow:null,spyEst:{}};
let tierPrices=null, faQuotes={}, faList=[], faSector=null, faPickT=null, tradeDraft={to:'',give:'',get:''};
const leagueCode=new URLSearchParams(location.search).get('code');
let reportHeight=()=>{};

const ctxFor = r => FC.ctxFor(market, r);
const myRoster = () => rosters.find(r=>r.user_id===uid);
const money = n => '$'+n.toFixed(2);
const sgn = n => (n>=0?'+':'')+n.toFixed(2);
function pct(n){return n==null?'<span class="muted">-</span>':'<span class="'+(n>=0?'up':'down')+'">'+(n>=0?'+':'')+n.toFixed(1)+'%</span>';}
function pts(n){return n==null?'<span class="muted">-</span>':'<span class="'+(n>=0?'up':'down')+'">'+sgn(n)+'</span>';}
function nick(u){const r=rosters.find(x=>x.user_id===u);return (r&&r.nickname)||'Player';}
function flash(kind,msg){
  const e=$(kind==='ok'?'globalOk':'globalMsg'), o=$(kind==='ok'?'globalMsg':'globalOk');
  o.style.display='none'; e.textContent=msg; e.style.display=msg?'block':'none';
  clearTimeout(flash.t); if(msg) flash.t=setTimeout(()=>{e.style.display='none';},5000);
  reportHeight();
}
async function saveRoster(r, fields){
  const res = await sbMut('sports_fantasy_rosters','PATCH',fields,'id=eq.'+r.id);
  if(!Array.isArray(res)||!res.length) throw new Error((res&&res.message)||'the save did not go through');
  return res[0];
}
async function fetchRosters(){ return sbGet('sports_fantasy_rosters','league_id=eq.'+league.id+'&submitted=eq.true'); }
async function fetchTrades(){ const t=await sbGet('sports_fantasy_trades','league_id=eq.'+league.id+'&order=created_at.desc'); return Array.isArray(t)?t:[]; }
async function ensureTier(){ if(tierPrices) return; try{ const d=await (await fetch(BACKEND+'/api/sp500-tiers')).json(); tierPrices=d.prices||{}; }catch(e){ tierPrices={}; } }
async function refresh(){ rosters=await fetchRosters(); trades=await fetchTrades(); renderAll(); }
function renderAll(){ renderStandings(); renderRoster(); renderFA(); renderTrades(); }

async function init(){
  uid=getUid();
  if(!leagueCode){$('loadingMsg').textContent='No league code given.';return;}
  try{
    const ls=await sbGet('sports_fantasy_leagues','code=eq.'+leagueCode+'&limit=1');
    if(!ls.length){$('loadingMsg').textContent='No league found for that code.';return;}
    league=ls[0];
    isCommissioner = !!(uid && league.commissioner_user_id===uid);
    myNick = isCommissioner ? (league.commissioner_name||'Commissioner') : (getName() || 'Player');
    rosters=await fetchRosters();
    market=await FC.loadMarket(BACKEND, rosters);
    trades=await fetchTrades();
    $('loadingMsg').style.display='none'; $('hub').style.display='block';
    $('leagueTitle').textContent=league.name;
    $('leagueSub').textContent='Code '+leagueCode+' \u00b7 $'+league.budget+' budget \u00b7 '+league.starters_count+' starters, '+league.bench_count+' bench';
    $('postAs').textContent='Posting as '+myNick+(isCommissioner?' (commissioner)':'');
    if(isCommissioner){$('tabBtnRoster').style.display='none';$('tabBtnFa').style.display='none';}
    renderRecap();
    renderAll(); loadPosts();
  }catch(e){$('loadingMsg').textContent='Could not load the league - try refreshing.';}
}

function renderRecap(){
  const banner = $('recapBanner');
  if(!league.end_date || league.end_date > new Date().toISOString().split('T')[0]){ banner.style.display='none'; return; }
  const ranked = FC.rank(rosters, league, r => FC.ctxFor(market, r));
  if(!ranked.length){ banner.style.display='none'; return; }
  const medal = i => i===0?'\ud83e\udd47':i===1?'\ud83e\udd48':i===2?'\ud83e\udd49':(i+1)+'.';
  banner.style.display = 'block';
  banner.innerHTML = `<div class="card" style="background:#fffbeb;border-color:#fde68a">
    <div style="font-weight:700;font-size:15px;margin-bottom:2px">\ud83c\udfc1 Season Complete</div>
    <div style="font-size:12px;color:var(--muted);margin-bottom:10px">This league ended ${new Date(league.end_date+'T00:00:00').toLocaleDateString(undefined,{month:'long',day:'numeric',year:'numeric'})}. Final standings:</div>
    ${ranked.slice(0,5).map((x,i)=>`<div style="display:flex;justify-content:space-between;padding:4px 0;font-size:13px"><span>${medal(i)} ${esc(x.r.nickname||'Student')}</span><span style="font-weight:600">${(x.s.score>=0?'+':'')+x.s.score.toFixed(2)}</span></div>`).join('')}
  </div>`;
}

const TABS=['standings','roster','fa','trades','discuss'];
const PANE={standings:'paneStandings',roster:'paneRoster',fa:'paneFa',trades:'paneTrades',discuss:'paneDiscuss'};
const BTN={standings:'tabBtnStandings',roster:'tabBtnRoster',fa:'tabBtnFa',trades:'tabBtnTrades',discuss:'tabBtnDiscuss'};
function showTab(t){
  TABS.forEach(x=>{ $(PANE[x]).style.display=x===t?'block':'none'; $(BTN[x]).classList.toggle('active',x===t); });
  if(t==='fa' && !faList.length) initFA();
}

// ---------- Standings ----------
function renderStandings(){
  const pane=$('paneStandings');
  const canSee=isCommissioner||!!myRoster();
  const ranked=FC.rank(rosters,league,ctxFor);
  if(!ranked.length){pane.innerHTML='<div class="card empty">No one has submitted a roster yet.</div>';return;}
  let h='<div class="card" style="padding:0;overflow:hidden"><table><thead><tr><th>#</th><th>Student</th><th>Score</th><th>Return</th><th>Alpha</th><th>Diversif.</th></tr></thead><tbody>';
  ranked.forEach((x,i)=>{
    const me=x.r.user_id===uid, s=x.s;
    const medal=i===0?'🥇':i===1?'🥈':i===2?'🥉':(i+1);
    h+='<tr class="row'+(me?' me':'')+'" data-uid="'+x.r.user_id+'"><td>'+medal+'</td><td><strong>'+esc(x.r.nickname||'Student')+'</strong>'+(me?' <span class="muted">(you)</span>':'')+'</td><td><strong>'+sgn(s.score)+'</strong></td><td>'+pct(s.retPct)+'</td><td>'+pts(s.alphaPts)+'</td><td>'+pts(s.divPts)+' <span class="muted">('+s.uniqueSectors+' sec)</span></td></tr>';
    if(expanded.has(x.r.user_id)){
      h+='<tr><td colspan="6" style="background:var(--bg)">';
      if(canSee){
        h+='<table style="font-size:13px"><thead><tr><th>Stock</th><th>Slot</th><th>Return</th><th>vs S&amp;P</th><th>Alpha pts</th></tr></thead><tbody>'+s.rows.map(p=>'<tr><td><strong>'+esc(p.t)+'</strong></td><td>'+p.slot+'</td><td>'+pct(p.ret)+'</td><td>'+pct(p.alpha)+'</td><td>'+pts(p.aPts)+'</td></tr>').join('')+'</tbody></table>';
        h+='<div class="muted" style="margin-top:6px">Diversification: '+s.uniqueSectors+' sector'+(s.uniqueSectors===1?'':'s')+' among starters (baseline '+s.baseline+') = '+sgn(s.divPts)+' &middot; Cash: '+money(s.cash)+' &middot; Moves this week: '+FC.movesThisWeek(x.r)+'</div>';
      }else h+='<div class="muted">Submit your own roster to see how classmates drafted.</div>';
      h+='</td></tr>';
    }
  });
  h+='</tbody></table></div>';
  h+='<details class="how"><summary>How the score works</summary><div style="margin-top:6px;line-height:1.6"><strong>Score = Return + Alpha + Diversification.</strong><br/><strong>Return</strong> is the real change in your roster\'s value since you drafted (including gains you locked in by dropping or trading a stock).<br/><strong>Alpha</strong> rewards beating the real S&amp;P 500: each stock earns 0.3 &times; its share of your budget &times; how far it beat (or trailed) the S&amp;P over the time you held it.<br/><strong>Diversification</strong> is +0.5 for each sector among your starters above '+FC.divBaseline(league)+', and \u22120.5 for each below. Putting everything in one sector costs you.</div></details>';
  h+='<div class="muted" style="margin-top:6px">Click a student to see their picks.</div>';
  pane.innerHTML=h;
  pane.querySelectorAll('tr.row').forEach(tr=>tr.addEventListener('click',()=>{const u=tr.dataset.uid;expanded.has(u)?expanded.delete(u):expanded.add(u);renderStandings();}));
}

// ---------- My Roster ----------
function movesBanner(r){
  if(league.moves_open===false) return '<span class="down">Roster moves are closed by your teacher.</span>';
  const left=FC.movesLeft(r,league), lim=league.weekly_move_limit==null?3:league.weekly_move_limit;
  return 'Free agent / trade moves left this week: <strong>'+left+' of '+lim+'</strong> &middot; bench swaps are unlimited';
}
function renderRoster(){
  const pane=$('paneRoster');
  const mine=myRoster();
  if(!mine){
    pane.innerHTML='<div class="card empty">You have not submitted a roster yet.<br/><br/>'+(league.draft_open?'<a class="btn btn-primary" href="/bullpen-sports-draft.html?code='+leagueCode+'">Draft Your Team \u2192</a>':'The draft is closed.')+'</div>';
    return;
  }
  const s=FC.score(mine,league,ctxFor(mine));
  const byT={}; s.rows.forEach(p=>byT[p.t]=p);
  const card=(t,isBench)=>{
    const p=byT[t]||{};
    let c='<div class="pick"><div class="tk">'+esc(t)+'</div><div class="muted">'+(isBench?'Bench':'Starter')+' \u00b7 $'+FC.paidOf(mine,t).toFixed(0)+'</div><div class="pc">'+pct(p.ret)+' <span class="muted">since added</span></div><div class="pc muted">vs S&amp;P '+pct(p.alpha)+'</div>';
    if(isBench&&(mine.starters||[]).length){
      c+='<div style="margin-top:6px"><select class="small swap-sel" data-bench="'+esc(t)+'"><option value="">Swap with...</option>'+mine.starters.map(x=>'<option value="'+esc(x)+'">'+esc(x)+'</option>').join('')+'</select> <button class="btn btn-ghost btn-sm" data-act="doswap" data-bench="'+esc(t)+'">Swap</button></div>';
    }
    return c+'</div>';
  };
  const log=(mine.moves_log||[]).slice(-6).reverse().map(m=>{
    const when=new Date(m.at).toLocaleDateString(undefined,{month:'short',day:'numeric'});
    const txt=m.type==='swap'?('Swapped '+esc(m.out)+' to bench, '+esc(m.in)+' to starters'):m.type==='fa'?((m.dropped?('Dropped '+esc(m.dropped)+', '):'')+'picked up '+esc(m.added)):('Traded '+esc(m.gave)+' for '+esc(m.got));
    return '<div class="tr"><span>'+txt+'</span><span class="muted">'+when+'</span></div>';
  }).join('');
  pane.innerHTML='<div class="card"><div class="muted">Your score</div><div style="font-size:30px;font-weight:800">'+sgn(s.score)+'</div>'
    +'<div class="stat3"><div><div class="n">'+pct(s.retPct)+'</div><div class="l">Return</div></div><div><div class="n">'+pts(s.alphaPts)+'</div><div class="l">Alpha pts</div></div><div><div class="n">'+pts(s.divPts)+'</div><div class="l">Diversif. ('+s.uniqueSectors+' sectors)</div></div><div><div class="n">'+money(s.total)+'</div><div class="l">Roster value</div></div><div><div class="n">'+money(s.cash)+'</div><div class="l">Cash</div></div></div>'
    +'<div class="muted" style="margin-top:10px">'+movesBanner(mine)+'</div></div>'
    +'<div class="card"><div style="font-weight:700;margin-bottom:6px">Starters</div><div class="picks">'+(mine.starters||[]).map(t=>card(t,false)).join('')+'</div>'
    +((mine.bench||[]).length?'<div style="font-weight:700;margin:12px 0 6px">Bench</div><div class="picks">'+mine.bench.map(t=>card(t,true)).join('')+'</div>':'')+'</div>'
    +(log?'<div class="card"><div style="font-weight:700;margin-bottom:4px">Your moves</div>'+log+'</div>':'');
}
async function doSwap(benchT){
  const mine=myRoster(); if(!mine) return;
  const sel=document.querySelector('.swap-sel[data-bench="'+benchT+'"]');
  const starterT=sel&&sel.value; if(!starterT){flash('err','Choose which starter to swap out.');return;}
  const ok=FC.canMove(mine,league,'swap'); if(ok.error){flash('err',ok.error);return;}
  const res=FC.swapBenchStarter(mine,starterT,benchT); if(res.error){flash('err',res.error);return;}
  try{ await saveRoster(mine,res.fields); await refresh(); flash('ok','Swapped '+starterT+' out and '+benchT+' in.'); }
  catch(e){ flash('err','Could not swap: '+e.message); }
}

// ---------- Free Agents ----------
async function initFA(){ await ensureTier(); await loadFA(POPULAR); }
async function loadFA(tickers){
  const need=tickers.filter(t=>!faQuotes[t]);
  if(need.length){
    try{
      const d=await (await fetch(BACKEND+'/api/quotes?symbols='+need.join(','))).json();
      ((d&&d.quoteResponse&&d.quoteResponse.result)||[]).forEach(q=>{faQuotes[q.symbol]={price:q.regularMarketPrice,name:q.shortName||q.longName||'',chg:q.regularMarketChangePercent||0};market.priceMap[q.symbol]=q.regularMarketPrice;});
    }catch(e){}
  }
  faList=tickers.filter(t=>faQuotes[t]);
  renderFA();
}
function renderFA(){
  const pane=$('paneFa');
  if(isCommissioner){pane.innerHTML='';return;}
  const mine=myRoster();
  if(!mine){pane.innerHTML='<div class="card empty">Draft your roster first.</div>';return;}
  const sectors=[...new Set(Object.values(FC.SECTORS))].sort();
  let h='<div class="card"><div class="muted">'+movesBanner(mine)+' &middot; Cash available: <strong>'+money(FC.cashOf(mine,league))+'</strong></div></div>';
  if(faPickT){
    const cost=(tierPrices&&tierPrices[faPickT]&&tierPrices[faPickT].price)||null;
    const roomy=(mine.starters||[]).length<league.starters_count||(mine.bench||[]).length<league.bench_count;
    const s=FC.score(mine,league,ctxFor(mine)); const byT={}; s.rows.forEach(p=>byT[p.t]=p);
    h+='<div class="panel"><div style="font-weight:700;margin-bottom:6px">Pick up '+esc(faPickT)+(cost!=null?' for '+money(cost):'')+'</div><div class="muted" style="margin-bottom:8px">Whoever you drop is sold at today\'s value and the gain or loss is locked into your score. Your cash covers the price.</div><select class="small" id="faDrop"><option value="">'+(roomy?'(add to an empty slot, no drop)':'Choose who to drop...')+'</option>'+FC.picksOf(mine).map(t=>'<option value="'+esc(t)+'">Drop '+esc(t)+' ('+(byT[t]&&byT[t].ret!=null?(byT[t].ret>=0?'+':'')+byT[t].ret.toFixed(1)+'%':'-')+')</option>').join('')+'</select> <button class="btn btn-primary btn-sm" data-act="confirmfa">Confirm move</button> <button class="btn btn-ghost btn-sm" data-act="cancelfa">Cancel</button></div>';
  }
  h+='<div style="margin:6px 0 10px"><input class="small" id="faSearch" style="width:60%;min-width:160px" placeholder="Search a ticker (e.g. XOM)"/> <button class="btn btn-ghost btn-sm" data-act="fasearch">Search</button></div>';
  h+='<div>'+'<span class="pill'+(faSector?'':' active')+'" data-act="fasector" data-sector="">Popular</span>'+sectors.map(s=>'<span class="pill'+(faSector===s?' active':'')+'" data-act="fasector" data-sector="'+esc(s)+'">'+(SECTOR_ABBR[s]||s)+'</span>').join('')+'</div>';
  const owned=new Set(FC.picksOf(mine));
  h+='<div class="grid">'+(faList.length?faList.map(t=>{
    const q=faQuotes[t], cost=(tierPrices&&tierPrices[t]&&tierPrices[t].price)||null, has=owned.has(t);
    return '<div class="fa-card"><div class="tk">'+esc(t)+'</div><div class="nm">'+esc(q.name)+'</div><div>'+money(q.price)+' '+pct(q.chg)+'</div>'+(cost!=null?'<span class="cost">Cost '+money(cost)+'</span>':'<span class="muted">no price</span>')+'<div style="margin-top:6px">'+(has?'<span class="muted">On your roster</span>':(cost!=null?'<button class="btn btn-ghost btn-sm" data-act="pickfa" data-t="'+esc(t)+'">Pick up</button>':''))+'</div></div>';
  }).join(''):'<div class="muted">Loading players...</div>')+'</div>';
  pane.innerHTML=h;
}
async function faFilterSector(sector){
  faSector=sector||null; faPickT=null; await ensureTier();
  if(!sector){await loadFA(POPULAR);return;}
  const list=Object.keys(FC.SECTORS).filter(t=>FC.SECTORS[t]===sector).sort().slice(0,30);
  await loadFA(list);
}
async function faSearch(){
  const q=(($('faSearch')||{}).value||'').trim().toUpperCase(); if(!q)return;
  faSector=null; faPickT=null; await ensureTier();
  const list=Object.keys(FC.SECTORS).filter(t=>t.includes(q)).slice(0,20);
  if(!list.length){faList=[];renderFA();flash('err','No S&P 500 ticker matches "'+q+'".');return;}
  await loadFA(list);
}
async function confirmFA(){
  const mine=myRoster(); if(!mine||!faPickT) return;
  const dropT=($('faDrop')||{}).value||null;
  const can=FC.canMove(mine,league,'fa'); if(can.error){flash('err',can.error);return;}
  try{
    // fresh roster + fresh prices right before any money move
    rosters=await fetchRosters(); const fresh=myRoster();
    market=await FC.loadMarket(BACKEND,rosters,[faPickT]);
    const cost=tierPrices[faPickT].price;
    const res=FC.freeAgent(fresh,league,ctxFor(fresh),dropT,faPickT,cost);
    if(res.error){flash('err',res.error);renderAll();return;}
    await saveRoster(fresh,res.fields);
    const added=faPickT; faPickT=null; await refresh(); flash('ok','Picked up '+added+(dropT?' and dropped '+dropT:'')+'.');
  }catch(e){ flash('err','Could not complete the move: '+e.message); }
}

// ---------- Trades ----------
function tradeValueLine(A,B,give,get){
  const res=FC.trade(A,B,league,FC.ctxFor(market,A),give,get);
  if(res.error) return {error:res.error};
  return {text:'You give '+give+' (worth '+money(res.vGive)+') and get '+get+' (worth '+money(res.vGet)+'). Trades settle at today\'s market value; the difference comes out of (or goes into) your cash.'};
}
function renderTrades(){
  const pane=$('paneTrades');
  const mine=myRoster();
  const pending=trades.filter(t=>t.status==='pending');
  let h='';
  if(!isCommissioner){
    if(!mine){pane.innerHTML='<div class="card empty">Draft your roster first.</div>';return;}
    const others=rosters.filter(r=>r.user_id!==uid);
    const theirs=others.find(r=>r.user_id===tradeDraft.to);
    let preview='';
    if(theirs&&tradeDraft.give&&tradeDraft.get){
      const v=tradeValueLine(mine,theirs,tradeDraft.give,tradeDraft.get);
      preview=v.error?'<div class="down" style="font-size:13px;margin-top:8px">'+esc(v.error)+'</div>':'<div class="muted" style="margin-top:8px">'+esc(v.text)+'</div>';
    }
    h+='<div class="card"><div style="font-weight:700;margin-bottom:8px">Propose a trade</div>'
      +(others.length?'<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><select class="small" id="tdTo"><option value="">Trade with...</option>'+others.map(r=>'<option value="'+r.user_id+'"'+(tradeDraft.to===r.user_id?' selected':'')+'>'+esc(r.nickname||'Student')+'</option>').join('')+'</select>'
        +'<select class="small" id="tdGive"><option value="">You give...</option>'+FC.picksOf(mine).map(t=>'<option'+(tradeDraft.give===t?' selected':'')+'>'+esc(t)+'</option>').join('')+'</select>'
        +'<select class="small" id="tdGet"><option value="">You get...</option>'+(theirs?FC.picksOf(theirs).map(t=>'<option'+(tradeDraft.get===t?' selected':'')+'>'+esc(t)+'</option>').join(''):'')+'</select>'
        +'<button class="btn btn-primary btn-sm" data-act="sendtrade">Send proposal</button></div>'+preview
        :'<div class="muted">No classmates have submitted rosters yet.</div>')+'</div>';
    const incoming=pending.filter(t=>t.to_user_id===uid), outgoing=pending.filter(t=>t.from_user_id===uid);
    h+='<div class="card"><div style="font-weight:700;margin-bottom:4px">Waiting on you</div>'+(incoming.length?incoming.map(t=>'<div class="tr"><span><strong>'+esc(t.from_nickname||'A classmate')+'</strong> offers <strong>'+esc(t.give_ticker)+'</strong> for your <strong>'+esc(t.get_ticker)+'</strong></span><span><button class="btn btn-primary btn-sm" data-act="acceptt" data-id="'+t.id+'">Accept</button> <button class="btn btn-ghost btn-sm" data-act="declinet" data-id="'+t.id+'">Decline</button></span></div>').join(''):'<div class="muted">No offers right now.</div>')+'</div>';
    h+='<div class="card"><div style="font-weight:700;margin-bottom:4px">Your open offers</div>'+(outgoing.length?outgoing.map(t=>'<div class="tr"><span>You offered <strong>'+esc(t.give_ticker)+'</strong> to <strong>'+esc(t.to_nickname||'a classmate')+'</strong> for their <strong>'+esc(t.get_ticker)+'</strong></span><button class="btn btn-ghost btn-sm" data-act="cancelt" data-id="'+t.id+'">Cancel</button></div>').join(''):'<div class="muted">None.</div>')+'</div>';
  }
  const done=trades.filter(t=>t.status!=='pending').slice(0,12);
  h+='<div class="card"><div style="font-weight:700;margin-bottom:4px">'+(isCommissioner?'All trades in this league':'Recent league trades')+'</div>'+((isCommissioner?trades:done).length?(isCommissioner?trades:done).map(t=>'<div class="tr"><span>'+esc(t.from_nickname||'?')+' \u2192 '+esc(t.to_nickname||'?')+': '+esc(t.give_ticker)+' for '+esc(t.get_ticker)+'</span><span class="st '+t.status+'">'+t.status+'</span></div>').join(''):'<div class="muted">No trades yet.</div>')+'</div>';
  pane.innerHTML=h;
}
async function sendTrade(){
  const mine=myRoster(); const {to,give,get}=tradeDraft;
  if(!mine||!to||!give||!get){flash('err','Pick a classmate, what you give, and what you get.');return;}
  const can=FC.canMove(mine,league,'trade'); if(can.error){flash('err',can.error);return;}
  const theirs=rosters.find(r=>r.user_id===to);
  const v=FC.trade(mine,theirs,league,FC.ctxFor(market,mine),give,get); if(v.error){flash('err',v.error);return;}
  const res=await sbMut('sports_fantasy_trades','POST',{league_id:league.id,from_user_id:uid,from_nickname:myNick,to_user_id:to,to_nickname:nick(to),give_ticker:give,get_ticker:get});
  if(!Array.isArray(res)||!res[0]){flash('err','Could not send: '+((res&&res.message)||'unknown error'));return;}
  tradeDraft={to:'',give:'',get:''}; await refresh(); flash('ok','Trade proposal sent.');
}
async function setTradeStatus(id,status){
  const res=await sbMut('sports_fantasy_trades','PATCH',{status,resolved_at:new Date().toISOString()},'id=eq.'+id+'&status=eq.pending');
  return Array.isArray(res)&&res.length>0;
}
async function acceptTrade(id){
  try{
    const cur=(await sbGet('sports_fantasy_trades','id=eq.'+id))[0];
    if(!cur||cur.status!=='pending'||cur.to_user_id!==uid){flash('err','That offer is no longer available.');await refresh();return;}
    rosters=await fetchRosters();
    const rA=rosters.find(r=>r.user_id===cur.from_user_id), rB=rosters.find(r=>r.user_id===uid);
    if(!rA||!rB){flash('err','One of the rosters could not be found.');return;}
    for(const r of [rA,rB]){ const c=FC.canMove(r,league,'trade'); if(c.error){flash('err',(r===rA?cur.from_nickname+': ':'You: ')+c.error);return;} }
    market=await FC.loadMarket(BACKEND,rosters,[cur.give_ticker,cur.get_ticker]);
    const res=FC.trade(rA,rB,league,FC.ctxFor(market,rA),cur.give_ticker,cur.get_ticker);
    if(res.error){flash('err',res.error);return;}
    await saveRoster(rA,res.a);
    try{ await saveRoster(rB,res.b); }
    catch(e){ await saveRoster(rA,{starters:rA.starters,bench:rA.bench,draft_prices:rA.draft_prices,draft_real_prices:rA.draft_real_prices,entry_benchmark:rA.entry_benchmark||{},realized_pnl:rA.realized_pnl||0,realized_alpha:rA.realized_alpha||0,moves_log:rA.moves_log||[]}); throw e; }
    await setTradeStatus(id,'accepted');
    await refresh(); flash('ok','Trade complete: you now have '+cur.give_ticker+'.');
  }catch(e){ flash('err','Could not complete the trade: '+e.message); }
}

// ---------- Discussion ----------
function showDiscussErr(m){const e=document.getElementById('discussMsg');e.textContent=m;e.style.display=m?'block':'none';if(m)setTimeout(()=>{e.style.display='none';},4000);}

async function loadPosts(){
  try{posts=await sbGet('sports_fantasy_posts','league_id=eq.'+league.id+'&order=created_at.asc');}catch(e){posts=[];}
  renderPosts();
}
function when(ts){return new Date(ts).toLocaleString(undefined,{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});}

function postHtml(p,isReply){
  const mine=p.user_id===uid;
  const canDelete=mine||isCommissioner;
  let h='<div class="'+(isReply?'reply':'post'+(p.is_commissioner?' teacher':''))+'" data-post="'+p.id+'">';
  h+='<div class="post-head"><span class="who">'+esc(p.nickname||'Player')+(p.is_commissioner?'<span class="tag">COMMISSIONER</span>':'')+'</span><span class="when">'+when(p.created_at)+'</span></div>';
  h+='<div class="post-body">'+esc(p.body)+'</div>';
  h+='<div class="actions">';
  if(!isReply)h+='<a data-act="reply" data-id="'+p.id+'">Reply</a>';
  if(canDelete)h+='<a data-act="delete" data-id="'+p.id+'">Delete</a>';
  h+='</div>';
  if(!isReply)h+='<!--REPLIES--><div class="reply-box" id="rb_'+p.id+'"></div>';
  return h+'</div>';
}

function renderPosts(){
  const wrap=document.getElementById('postsWrap');
  const tops=posts.filter(p=>!p.parent_id).sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));
  if(!tops.length){wrap.innerHTML='<div class="card empty">No posts yet. Start the conversation.</div>';return;}
  const byParent={};
  posts.filter(p=>p.parent_id).forEach(p=>{(byParent[p.parent_id]=byParent[p.parent_id]||[]).push(p);});
  wrap.innerHTML=tops.map(p=>{
    const reps=(byParent[p.id]||[]);
    let h=postHtml(p,false);
    h=h.replace('<!--REPLIES-->',reps.length?'<div class="replies">'+reps.map(r=>postHtml(r,true)).join('')+'</div>':'');
    return h;
  }).join('');
}

async function submitPost(parentId,bodyOverride,btn){
  const ta=parentId?document.getElementById('rt_'+parentId):document.getElementById('newPostBody');
  const body=(ta.value||'').trim();
  if(!body){showDiscussErr('Write something first.');return;}
  const b=btn||document.getElementById('postBtn');
  b.disabled=true;
  try{
    const res=await sbWrite('sports_fantasy_posts',{league_id:league.id,parent_id:parentId||null,user_id:uid,nickname:myNick,is_commissioner:isCommissioner,body});
    if(!Array.isArray(res)||!res[0]){showDiscussErr('Could not post: '+((res&&res.message)||'unknown error'));b.disabled=false;return;}
    ta.value='';
    await loadPosts();
  }catch(e){showDiscussErr('Could not post - try again.');}
  b.disabled=false;
}

document.getElementById('postsWrap').addEventListener('click',async ev=>{
  const el=ev.target.closest('[data-act]');if(!el)return;
  const act=el.dataset.act,id=el.dataset.id;
  if(act==='reply'){
    const box=document.getElementById('rb_'+id);
    if(box.innerHTML){box.innerHTML='';return;}
    box.innerHTML='<div style="margin-top:8px"><textarea id="rt_'+id+'" style="min-height:50px" placeholder="Write a reply..."></textarea><div style="text-align:right;margin-top:6px"><button class="btn btn-primary btn-sm" data-act="sendreply" data-id="'+id+'">Reply</button></div></div>';
  }else if(act==='sendreply'){
    submitPost(id,null,el);
  }else if(act==='delete'){
    // two-click confirm, no blocking browser dialog
    if(el.dataset.armed!=='1'){el.dataset.armed='1';el.textContent='Sure? Click again';setTimeout(()=>{el.dataset.armed='';el.textContent='Delete';},3000);return;}
    const ok=await sbWrite('sports_fantasy_posts',null,'DELETE','id=eq.'+id);
    if(!ok)showDiscussErr('Could not delete.');
    await loadPosts();
  }
});



// ---------- event wiring ----------
document.addEventListener('click', async ev=>{
  const el=ev.target.closest('[data-act]'); if(!el||el.closest('#postsWrap')) return;
  const a=el.dataset.act;
  if(a==='doswap') doSwap(el.dataset.bench);
  else if(a==='fasector') faFilterSector(el.dataset.sector);
  else if(a==='fasearch') faSearch();
  else if(a==='pickfa'){ faPickT=el.dataset.t; renderFA(); }
  else if(a==='cancelfa'){ faPickT=null; renderFA(); }
  else if(a==='confirmfa') confirmFA();
  else if(a==='sendtrade') sendTrade();
  else if(a==='acceptt') acceptTrade(el.dataset.id);
  else if(a==='declinet'){ await setTradeStatus(el.dataset.id,'declined'); await refresh(); flash('ok','Offer declined.'); }
  else if(a==='cancelt'){ await setTradeStatus(el.dataset.id,'cancelled'); await refresh(); flash('ok','Offer cancelled.'); }
});
document.addEventListener('change', ev=>{
  const id=ev.target.id;
  if(id==='tdTo'){ tradeDraft={to:ev.target.value,give:tradeDraft.give,get:''}; renderTrades(); }
  else if(id==='tdGive'){ tradeDraft.give=ev.target.value; renderTrades(); }
  else if(id==='tdGet'){ tradeDraft.get=ev.target.value; renderTrades(); }
});
document.addEventListener('keydown', ev=>{ if(ev.key==='Enter' && ev.target.id==='faSearch') faSearch(); });

// Embed mode: used when the hub sits inside the student's Fantasy tab
const EMBED = new URLSearchParams(location.search).get('embed') === '1';
if(EMBED){
  document.querySelector('nav').style.display = 'none';
  document.querySelector('.page').style.padding = '0 0 16px';
  document.body.style.background = 'transparent';
  document.body.style.minHeight = '0';
  const base = document.createElement('base'); base.target = '_top'; document.head.appendChild(base);
  reportHeight = () => parent.postMessage({type:'leagueHeight', h: document.body.offsetHeight}, location.origin);
  // Report after every render, not only on resize: ResizeObserver alone isn't reliable in every browser state
  ['renderStandings','renderRoster','renderFA','renderTrades','renderPosts','showTab'].forEach(n => {
    const fn = window[n];
    window[n] = function(){ const r = fn.apply(this, arguments); reportHeight(); return r; };
  });
  new ResizeObserver(reportHeight).observe(document.body);
  window.addEventListener('load', reportHeight);
  setTimeout(reportHeight, 500); setTimeout(reportHeight, 1500);
}

init();
</script>
