<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bullpen Tycoon — Build Your Empire | StockPilot</title>
<meta name="description" content="Start in the USA, invest in real companies, and unlock new countries as your net worth grows. Real stocks, real prices, a collection worth showing off.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --board:#fdf3de;
  --board2:#fbe9c6;
  --ink:#3a2b1a;
  --ink-dim:#8a7455;
  --card:#fffaf0;
  --line:#e8d4a8;
  --gold:#e8a020;
  --gold-dark:#b87a10;
  --green:#3fb27f;
  --green-dark:#2c8a5f;
  --red:#e8432b;
  --shadow:0 4px 0 rgba(58,43,26,0.18);
}

html{scroll-behavior:smooth}
body{
  background:linear-gradient(180deg,var(--board) 0%,var(--board2) 100%);
  color:var(--ink);font-family:'Nunito',sans-serif;min-height:100vh;
  background-image:radial-gradient(circle, rgba(58,43,26,0.05) 1px, transparent 1px);
  background-size:22px 22px;
}
h1,h2,h3,.display{font-family:'Baloo 2',sans-serif}

/* ── Nav ── */
.tv-nav{
  position:sticky;top:0;z-index:100;display:flex;align-items:center;justify-content:space-between;
  padding:14px 24px;background:rgba(253,243,222,0.92);backdrop-filter:blur(10px);
  border-bottom:3px solid var(--line);
}
.tv-logo{display:flex;align-items:center;gap:10px;text-decoration:none}
.tv-logo img{height:32px;width:32px;border-radius:8px}
.tv-logo-text{font-family:'Baloo 2',sans-serif;font-weight:700;font-size:19px;color:var(--ink)}
.tv-logo-sub{font-size:10px;font-weight:700;color:var(--gold-dark);letter-spacing:1px;text-transform:uppercase}
.tv-back{font-size:13px;color:var(--ink-dim);text-decoration:none;font-weight:700}
.tv-back:hover{color:var(--ink)}

/* ── Header / stats bar ── */
.stats-bar{
  max-width:1000px;margin:20px auto 0;padding:0 20px;
  display:grid;grid-template-columns:1fr 1fr;gap:14px;
}
@media(max-width:600px){.stats-bar{grid-template-columns:1fr}}
.stat-box{
  background:var(--card);border:3px solid var(--line);border-radius:16px;padding:16px 20px;
  box-shadow:var(--shadow);
}
.stat-label{font-size:11px;font-weight:800;color:var(--ink-dim);text-transform:uppercase;letter-spacing:1px}
.stat-value{font-family:'Baloo 2',sans-serif;font-size:28px;font-weight:700;color:var(--ink);margin-top:2px}
.stat-value.green{color:var(--green-dark)}

.progress-box{
  max-width:1000px;margin:14px auto 0;padding:0 20px;
}
.progress-card{
  background:var(--card);border:3px solid var(--line);border-radius:16px;padding:16px 20px;box-shadow:var(--shadow);
}
.progress-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:13px;font-weight:700}
.progress-track{height:16px;background:var(--board2);border:2px solid var(--line);border-radius:100px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--gold),var(--gold-dark));border-radius:100px;transition:width 0.6s ease}

/* ── Country sections ── */
.tv-main{max-width:1000px;margin:24px auto;padding:0 20px 80px}
.country-section{margin-bottom:36px}
.country-head{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.country-flag{font-size:34px;line-height:1}
.country-name{font-family:'Baloo 2',sans-serif;font-size:24px;font-weight:700}
.country-lock-note{font-size:12px;color:var(--ink-dim);font-weight:700;margin-left:auto}

.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}

.co-card{
  background:var(--card);border:3px solid var(--line);border-radius:16px;padding:16px 14px;
  box-shadow:var(--shadow);text-align:center;cursor:pointer;transition:transform 0.12s;position:relative;
}
.co-card:hover{transform:translateY(-2px)}
.co-card.owned{border-color:var(--green);box-shadow:0 4px 0 rgba(63,178,127,0.3)}
.co-card.locked{cursor:default;opacity:0.55;filter:grayscale(1)}
.co-card.locked:hover{transform:none}
.co-logo{font-size:38px;margin-bottom:8px}
.co-ticker{font-family:'Baloo 2',sans-serif;font-weight:700;font-size:15px}
.co-name{font-size:11px;color:var(--ink-dim);font-weight:700;margin-top:2px;min-height:28px}
.co-price{font-size:13px;font-weight:800;color:var(--green-dark);margin-top:6px}
.co-owned-badge{
  position:absolute;top:-8px;right:-8px;background:var(--green);color:#fff;
  font-size:10px;font-weight:800;padding:4px 8px;border-radius:100px;border:2px solid var(--card);
}
.co-lock-icon{position:absolute;top:10px;right:10px;font-size:16px}

/* ── Buy modal ── */
.modal-overlay{position:fixed;inset:0;background:rgba(58,43,26,0.5);display:flex;align-items:center;justify-content:center;z-index:1000;padding:20px;opacity:0;pointer-events:none;transition:opacity 0.2s}
.modal-overlay.open{opacity:1;pointer-events:all}
.modal{background:var(--card);border:4px solid var(--line);border-radius:20px;padding:26px;width:100%;max-width:380px;box-shadow:0 8px 0 rgba(58,43,26,0.18);transform:translateY(10px);transition:transform 0.2s}
.modal-overlay.open .modal{transform:translateY(0)}
.modal-close{position:absolute;top:14px;right:18px;background:none;border:none;font-size:20px;cursor:pointer;color:var(--ink-dim)}
.modal-logo{font-size:52px;text-align:center;margin-bottom:6px}
.modal-name{font-family:'Baloo 2',sans-serif;font-size:22px;font-weight:700;text-align:center}
.modal-price{text-align:center;color:var(--green-dark);font-weight:800;margin-top:2px;margin-bottom:18px}
.modal-field label{font-size:12px;font-weight:800;color:var(--ink-dim);text-transform:uppercase;letter-spacing:0.5px}
.modal-field input{width:100%;border:2px solid var(--line);border-radius:10px;padding:11px 14px;font-size:16px;margin-top:6px;font-family:'Nunito',sans-serif;background:#fff}
.modal-field input:focus{outline:none;border-color:var(--gold)}
.modal-hint{font-size:12px;color:var(--ink-dim);margin-top:8px;text-align:center}
.btn-buy{width:100%;background:var(--green);color:#fff;border:none;padding:14px;border-radius:12px;font-size:16px;font-weight:800;cursor:pointer;margin-top:16px;font-family:'Baloo 2',sans-serif;box-shadow:0 3px 0 var(--green-dark)}
.btn-buy:active{transform:translateY(2px);box-shadow:none}
.btn-buy:disabled{opacity:0.5;cursor:default}

/* ── Unlock celebration ── */
.unlock-overlay{position:fixed;inset:0;background:rgba(58,43,26,0.75);display:flex;align-items:center;justify-content:center;z-index:2000;opacity:0;pointer-events:none;transition:opacity 0.3s}
.unlock-overlay.open{opacity:1;pointer-events:all}
.unlock-card{background:var(--card);border:5px solid var(--gold);border-radius:24px;padding:40px 32px;text-align:center;max-width:340px;transform:scale(0.8);transition:transform 0.35s cubic-bezier(0.34,1.56,0.64,1)}
.unlock-overlay.open .unlock-card{transform:scale(1)}
.unlock-flag{font-size:70px;margin-bottom:8px}
.unlock-title{font-size:13px;font-weight:800;color:var(--gold-dark);text-transform:uppercase;letter-spacing:2px}
.unlock-country{font-family:'Baloo 2',sans-serif;font-size:30px;font-weight:700;margin:6px 0 16px}
.unlock-subtitle{font-size:14px;color:var(--ink-dim);margin-bottom:18px}
.btn-unlock-close{background:var(--gold);color:#fff;border:none;padding:13px 28px;border-radius:12px;font-size:15px;font-weight:800;cursor:pointer;font-family:'Baloo 2',sans-serif;box-shadow:0 3px 0 var(--gold-dark)}
.btn-unlock-close:active{transform:translateY(2px);box-shadow:none}

.loading{text-align:center;color:var(--ink-dim);padding:60px 20px;font-weight:700}
</style>
</head>
<body>

<nav class="tv-nav">
  <a href="/bullpen.html" class="tv-logo">
    <img src="/logo.jpg" alt="StockPilot"/>
    <div><div class="tv-logo-text">StockPilot</div><div class="tv-logo-sub">Bullpen Tycoon</div></div>
  </a>
  <a href="/bullpen.html" class="tv-back">← Bullpen</a>
</nav>

<div class="stats-bar">
  <div class="stat-box">
    <div class="stat-label">Net Worth</div>
    <div class="stat-value green" id="netWorthDisplay">$10,000</div>
  </div>
  <div class="stat-box">
    <div class="stat-label">Cash on Hand</div>
    <div class="stat-value" id="cashDisplay">$10,000</div>
  </div>
</div>

<div class="progress-box" id="progressBox" style="display:none">
  <div class="progress-card">
    <div class="progress-top">
      <span>Next unlock: <span id="nextCountryName"></span></span>
      <span id="progressText"></span>
    </div>
    <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
  </div>
</div>

<div class="tv-main" id="tvMain">
  <div class="loading">Loading your empire...</div>
</div>

<!-- Buy modal -->
<div class="modal-overlay" id="buyModal">
  <div class="modal" style="position:relative">
    <button class="modal-close" onclick="closeBuyModal()">✕</button>
    <div class="modal-logo" id="buyLogo"></div>
    <div class="modal-name" id="buyName"></div>
    <div class="modal-price" id="buyPrice"></div>
    <div class="modal-field">
      <label>Shares to buy</label>
      <input type="number" id="buyShares" min="1" step="1" value="1" oninput="updateBuyTotal()">
    </div>
    <div class="modal-hint" id="buyTotal"></div>
    <button class="btn-buy" id="buyBtn" onclick="confirmBuy()">Buy →</button>
  </div>
</div>

<!-- Unlock celebration -->
<div class="unlock-overlay" id="unlockOverlay">
  <div class="unlock-card">
    <div class="unlock-flag" id="unlockFlag"></div>
    <div class="unlock-title">Country Unlocked!</div>
    <div class="unlock-country" id="unlockCountryName"></div>
    <div class="unlock-subtitle" id="unlockSubtitle"></div>
    <button class="btn-unlock-close" onclick="closeUnlockCelebration()">Let's go! 🎉</button>
  </div>
</div>

<script src="/bullpen-shared.js"></script>
<script>
// ── Game data ──
const COUNTRIES = [
  { id:'usa', flag:'🇺🇸', name:'United States', threshold:0, companies:[
    {ticker:'AAPL', name:'Apple', logo:'🍎'},
    {ticker:'MSFT', name:'Microsoft', logo:'🪟'},
    {ticker:'AMZN', name:'Amazon', logo:'📦'},
    {ticker:'GOOGL', name:'Alphabet', logo:'🔍'},
    {ticker:'TSLA', name:'Tesla', logo:'⚡'},
  ]},
  { id:'japan', flag:'🇯🇵', name:'Japan', threshold:15000, companies:[
    {ticker:'TM', name:'Toyota', logo:'🚗'},
    {ticker:'SONY', name:'Sony', logo:'🎮'},
    {ticker:'NTDOY', name:'Nintendo', logo:'🍄'},
    {ticker:'HMC', name:'Honda', logo:'🏍️'},
  ]},
  { id:'korea', flag:'🇰🇷', name:'South Korea', threshold:25000, companies:[
    {ticker:'CPNG', name:'Coupang', logo:'📱'},
    {ticker:'KB', name:'KB Financial', logo:'🏦'},
    {ticker:'PKX', name:'POSCO', logo:'⚙️'},
    {ticker:'SKM', name:'SK Telecom', logo:'📡'},
  ]},
  { id:'germany', flag:'🇩🇪', name:'Germany', threshold:40000, companies:[
    {ticker:'SAP', name:'SAP', logo:'💻'},
    {ticker:'DB', name:'Deutsche Bank', logo:'🏦'},
    {ticker:'VWAGY', name:'Volkswagen', logo:'🚙'},
    {ticker:'BAYRY', name:'Bayer', logo:'💊'},
  ]},
  { id:'uk', flag:'🇬🇧', name:'United Kingdom', threshold:60000, companies:[
    {ticker:'UL', name:'Unilever', logo:'🧴'},
    {ticker:'SHEL', name:'Shell', logo:'⛽'},
    {ticker:'HSBC', name:'HSBC', logo:'🏦'},
    {ticker:'AZN', name:'AstraZeneca', logo:'💉'},
  ]},
  { id:'china', flag:'🇨🇳', name:'China', threshold:100000, companies:[
    {ticker:'BABA', name:'Alibaba', logo:'🛒'},
    {ticker:'JD', name:'JD.com', logo:'📦'},
    {ticker:'PDD', name:'Pinduoduo', logo:'🛍️'},
    {ticker:'NIO', name:'NIO', logo:'🔋'},
  ]},
];
const ALL_TICKERS = COUNTRIES.flatMap(c => c.companies.map(co => co.ticker));

// ── Player identity: signed-in user_id, or a persistent guest device id ──
function getDeviceId(){
  let id = localStorage.getItem('tycoon_device_id');
  if(!id){ id = 'device_' + Math.random().toString(36).slice(2) + Date.now().toString(36); localStorage.setItem('tycoon_device_id', id); }
  return id;
}
function getUid(){
  const token = localStorage.getItem('supabase_token');
  if(!token) return null;
  try { return JSON.parse(atob(token.split('.')[1])).sub; } catch(e) { return null; }
}

let player = null;
let holdings = [];
let quotes = {};

async function loadPlayer(){
  const uid = getUid();
  const deviceId = getDeviceId();
  let rows = [];
  if(uid){
    rows = await sbGet('tycoon_players', 'user_id=eq.'+uid);
  }
  if(!rows.length){
    rows = await sbGet('tycoon_players', 'device_id=eq.'+deviceId);
  }
  if(rows.length){
    player = rows[0];
  } else {
    const created = await sbPost('tycoon_players', { user_id: uid, device_id: deviceId, starting_cash: 10000, cash: 10000, unlocked_countries: ['usa'] });
    player = created[0];
  }
  holdings = await sbGet('tycoon_holdings', 'player_id=eq.'+player.id);
}

const BACKEND = 'https://stockpilot-production-c94f.up.railway.app';

async function loadQuotes(){
  try {
    const res = await fetch(BACKEND + '/api/quotes?symbols=' + ALL_TICKERS.join(','));
    const data = await res.json();
    (data.quoteResponse?.result || []).forEach(q => { quotes[q.symbol] = q.regularMarketPrice; });
  } catch(e){ /* fall through with whatever we have, price shows as -- */ }
}

function netWorth(){
  let total = player.cash;
  holdings.forEach(h => { total += (quotes[h.ticker] || h.avg_cost) * h.shares; });
  return total;
}

function render(){
  const nw = netWorth();
  document.getElementById('netWorthDisplay').textContent = '$' + nw.toLocaleString(undefined, {maximumFractionDigits:0});
  document.getElementById('cashDisplay').textContent = '$' + player.cash.toLocaleString(undefined, {maximumFractionDigits:0});

  const unlocked = player.unlocked_countries;
  const nextCountry = COUNTRIES.find(c => !unlocked.includes(c.id));
  const progressBox = document.getElementById('progressBox');
  if(nextCountry){
    progressBox.style.display = 'block';
    const pct = Math.min(100, (nw / nextCountry.threshold) * 100);
    document.getElementById('nextCountryName').textContent = nextCountry.flag + ' ' + nextCountry.name;
    document.getElementById('progressText').textContent = '$' + nw.toLocaleString(undefined,{maximumFractionDigits:0}) + ' / $' + nextCountry.threshold.toLocaleString();
    document.getElementById('progressFill').style.width = pct + '%';
  } else {
    progressBox.style.display = 'none';
  }

  const main = document.getElementById('tvMain');
  main.innerHTML = COUNTRIES.map(country => {
    const isUnlocked = unlocked.includes(country.id);
    return `
      <div class="country-section">
        <div class="country-head">
          <div class="country-flag">${country.flag}</div>
          <div class="country-name">${country.name}</div>
          ${!isUnlocked ? `<div class="country-lock-note">🔒 Unlocks at $${country.threshold.toLocaleString()} net worth</div>` : ''}
        </div>
        <div class="card-grid">
          ${country.companies.map(co => {
            const held = holdings.find(h => h.ticker === co.ticker);
            const price = quotes[co.ticker];
            return `
              <div class="co-card ${!isUnlocked ? 'locked' : ''} ${held ? 'owned' : ''}" ${isUnlocked ? `onclick="openBuyModal('${co.ticker}')"` : ''}>
                ${!isUnlocked ? '<div class="co-lock-icon">🔒</div>' : ''}
                ${held ? `<div class="co-owned-badge">${held.shares} sh</div>` : ''}
                <div class="co-logo">${co.logo}</div>
                <div class="co-ticker">${co.ticker}</div>
                <div class="co-name">${co.name}</div>
                <div class="co-price">${price ? '$'+price.toFixed(2) : (isUnlocked ? '...' : '')}</div>
              </div>`;
          }).join('')}
        </div>
      </div>`;
  }).join('');
}

async function checkUnlocks(){
  const nw = netWorth();
  const next = COUNTRIES.find(c => !player.unlocked_countries.includes(c.id) && nw >= c.threshold);
  if(next){
    player.unlocked_countries = [...player.unlocked_countries, next.id];
    await sbPatch('tycoon_players', 'id=eq.'+player.id, { unlocked_countries: player.unlocked_countries });
    showUnlockCelebration(next);
  }
}

function showUnlockCelebration(country){
  document.getElementById('unlockFlag').textContent = country.flag;
  document.getElementById('unlockCountryName').textContent = country.name;
  document.getElementById('unlockSubtitle').textContent = country.companies.map(c => c.name).join(', ') + ' are now in your collection.';
  document.getElementById('unlockOverlay').classList.add('open');
}
function closeUnlockCelebration(){
  document.getElementById('unlockOverlay').classList.remove('open');
  render();
}

// ── Buying ──
let buyingTicker = null;
function openBuyModal(ticker){
  buyingTicker = ticker;
  const co = COUNTRIES.flatMap(c => c.companies).find(c => c.ticker === ticker);
  document.getElementById('buyLogo').textContent = co.logo;
  document.getElementById('buyName').textContent = co.name + ' (' + co.ticker + ')';
  const price = quotes[ticker];
  document.getElementById('buyPrice').textContent = price ? '$' + price.toFixed(2) + '/share' : 'Price unavailable';
  document.getElementById('buyShares').value = 1;
  updateBuyTotal();
  document.getElementById('buyModal').classList.add('open');
}
function closeBuyModal(){ document.getElementById('buyModal').classList.remove('open'); }
function updateBuyTotal(){
  const shares = parseInt(document.getElementById('buyShares').value) || 0;
  const price = quotes[buyingTicker] || 0;
  const total = shares * price;
  const btn = document.getElementById('buyBtn');
  document.getElementById('buyTotal').textContent = 'Total: $' + total.toLocaleString(undefined,{maximumFractionDigits:2}) + ' · Cash available: $' + player.cash.toLocaleString(undefined,{maximumFractionDigits:0});
  btn.disabled = shares <= 0 || total > player.cash || total <= 0;
}
async function confirmBuy(){
  const shares = parseInt(document.getElementById('buyShares').value) || 0;
  const price = quotes[buyingTicker] || 0;
  const total = shares * price;
  if(shares <= 0 || total > player.cash || total <= 0) return;

  const btn = document.getElementById('buyBtn');
  btn.textContent = 'Buying...'; btn.disabled = true;

  const existing = holdings.find(h => h.ticker === buyingTicker);
  const newCash = player.cash - total;
  const cashSaved = await sbPatch('tycoon_players', 'id=eq.'+player.id, { cash: newCash });
  if(!cashSaved){ btn.textContent = 'Buy →'; alert('Purchase failed - try again.'); return; }
  player.cash = newCash;

  if(existing){
    const newShares = existing.shares + shares;
    const newAvg = ((existing.avg_cost * existing.shares) + total) / newShares;
    await sbPatch('tycoon_holdings', 'id=eq.'+existing.id, { shares: newShares, avg_cost: newAvg });
    existing.shares = newShares; existing.avg_cost = newAvg;
  } else {
    const created = await sbPost('tycoon_holdings', { player_id: player.id, ticker: buyingTicker, shares, avg_cost: price });
    holdings.push(created[0]);
  }

  btn.textContent = 'Buy →'; btn.disabled = false;
  closeBuyModal();
  render();
  await checkUnlocks();
}

async function init(){
  await loadPlayer();
  await loadQuotes();
  render();
  await checkUnlocks();
}
init();
</script>
</body>
</html>
