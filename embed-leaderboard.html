<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Standings | StockPilot</title>
<style>
:root{--bg:#0b0d12;--card:#12151c;--text:#f2f4f8;--muted:#8d95a5;--line:#232834;--accent:#2ecc71;--gold:#f5c542}
:root[data-theme="light"]{--bg:#ffffff;--card:#f6f7f9;--text:#12161f;--muted:#5d6574;--line:#e2e5ea;--accent:#0f9d58;--gold:#b7860b}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{padding:14px}
h1{font-size:16px;margin:0 0 2px;font-weight:700}
.sub{color:var(--muted);font-size:12px;margin-bottom:10px}
table{width:100%;border-collapse:collapse}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
td{padding:9px 8px;border-bottom:1px solid var(--line)}
th.r,td.r{text-align:right;font-variant-numeric:tabular-nums}
td.rank{width:36px;color:var(--muted);font-weight:700}
tr.top1 td.rank{color:var(--gold)}
tr.top1 td.name{font-weight:700}
.rnd{font-weight:700;margin:14px 0 6px;font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.tbl{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 8px;margin-bottom:8px}
.tlabel{font-size:11px;color:var(--muted);padding:4px 8px}
.empty,.err{color:var(--muted);padding:18px 8px}
.foot{margin-top:10px;font-size:11px;color:var(--muted);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.foot a{color:var(--accent);text-decoration:none;font-weight:600}
</style>
</head>
<body>
<div class="wrap">
  <h1 id="title">Loading standings</h1>
  <div class="sub" id="sub"></div>
  <div id="out"></div>
  <div class="foot"><span id="upd"></span><a href="https://mystockspilot.com" target="_blank" rel="noopener">Powered by StockPilot</a></div>
</div>
<script>
(function(){
  var API='https://stockpilot-production-c94f.up.railway.app';
  var GAMES=['league','fantasy','sports','showdown','teams','madness','crash','puzzle','speedround','streak'];
  var SOLO=['crash','puzzle','speedround','streak'];
  var p=new URLSearchParams(location.search);
  var game=(p.get('game')||'league').toLowerCase();
  if(GAMES.indexOf(game)<0) game='league';
  var solo=SOLO.indexOf(game)>=0;
  var code=solo?'TOP':(p.get('code')||'').trim().toUpperCase();
  var top=Math.max(1,Math.min(50,parseInt(p.get('top')||'10',10)||10));
  if(p.get('theme')==='light') document.documentElement.setAttribute('data-theme','light');
  var $=function(id){return document.getElementById(id)};
  function el(tag,cls,text){var e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e;}
  function msg(cls,t){var o=$('out');o.textContent='';o.appendChild(el('div',cls,t));}
  function table(headers,rows){
    var t=el('table'),h=el('thead'),hr=el('tr');
    headers.forEach(function(c){hr.appendChild(el('th',c[1],c[0]));});h.appendChild(hr);t.appendChild(h);
    var b=el('tbody');
    rows.forEach(function(r){var tr=el('tr',r.top?'top1':'');r.cells.forEach(function(c){tr.appendChild(el('td',c[1],c[0]));});b.appendChild(tr);});
    t.appendChild(b);return t;
  }
  function renderRounds(d){
    var o=$('out');o.textContent='';
    if(!d.rounds||!d.rounds.length){msg('empty','The bracket has not started yet.');return;}
    d.rounds.forEach(function(r){
      o.appendChild(el('div','rnd','Round '+r.round+(r.current?' \u00b7 in progress':'')));
      r.tables.forEach(function(t){
        var c=el('div','tbl');c.appendChild(el('div','tlabel',t.label));
        c.appendChild(table([['Player',''],['Return','r']],t.players.map(function(pl,i){return {top:pl.placement===1||(!pl.placement&&i===0&&t.status!=='completed'),cells:[[pl.name+(pl.advanced?' \u2713':''),'name'],[pl.display||'\u2014','r']]};})));
        o.appendChild(c);
      });
    });
  }
  function render(d){
    $('title').textContent=d.league.name||'Standings';
    $('sub').textContent=d.league.sub||'';
    if(d.rounds) renderRounds(d); else {
      var rows=d.standings.slice(0,top);
      if(!rows.length){msg('empty','No results yet.');return;}
      var o=$('out');o.textContent='';
      o.appendChild(table([['#',''],[game==='teams'?'Team':'Player',''],[(d.columns&&d.columns.score)||'Score','r']],rows.map(function(r){return {top:r.rank===1,cells:[[r.rank,'rank'],[r.name,'name'],[r.display!=null?r.display:r.score,'r']]};})));
    }
    $('upd').textContent='Updated '+new Date(d.updatedAt).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'});
  }
  function load(){
    if(!solo&&!/^[A-Z0-9]{3,8}$/.test(code)){ $('title').textContent='Standings'; msg('err','Add your code to the link, for example ?code=ABC123'); return; }
    fetch(API+'/api/public/'+game+'/'+encodeURIComponent(code)).then(function(r){return r.json().then(function(j){return {ok:r.ok,status:r.status,j:j}})}).then(function(x){
      if(x.ok) return render(x.j);
      $('title').textContent='Standings';
      msg('err', x.status===404?'Not found. Check the code.':x.status===403?'This competition is not available publicly.':'Standings are temporarily unavailable.');
    }).catch(function(){ if(!$('out').firstChild) msg('err','Standings are temporarily unavailable.'); });
  }
  load();
  setInterval(load,60000);
})();
</script>
</body>
</html>
