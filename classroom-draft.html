<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Fantasy Draft | StockPilot Classroom</title>
<link rel="icon" type="image/jpeg" href="https://mystockspilot.com/logo.jpg"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --green:#16a34a;--green-l:#f0fdf4;--green-b:#bbf7d0;
  --blue:#2563eb;--blue-l:#eff6ff;--blue-b:#bfdbfe;
  --red:#dc2626;--red-l:#fef2f2;
  --gray:#6b7280;--border:#e5e7eb;--bg:#f9fafb;--white:#fff;
  --text:#111827;--muted:#6b7280;
}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
nav{background:var(--white);border-bottom:1px solid var(--border);padding:14px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.nav-logo{display:flex;align-items:center;gap:8px;text-decoration:none;font-weight:700;font-size:16px;color:var(--text)}
.nav-logo img{height:28px;width:28px;border-radius:6px}
.nav-badge{background:#dcfce7;color:var(--green);font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px;letter-spacing:0.05em}
.btn{padding:8px 18px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;border:none;transition:all 0.15s}
.btn-primary{background:var(--green);color:white}.btn-primary:hover{background:#15803d}
.btn-primary:disabled{background:#9ca3af;cursor:not-allowed}
.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--muted)}.btn-ghost:hover{border-color:var(--text);color:var(--text)}
.btn-sm{padding:6px 14px;font-size:13px}
.page{max-width:1200px;margin:0 auto;padding:24px 20px}
.card{background:var(--white);border:1px solid var(--border);border-radius:14px;padding:20px}
.grid2{display:grid;grid-template-columns:340px 1fr;gap:20px;align-items:start}
@media(max-width:860px){.grid2{grid-template-columns:1fr}}
.budget-box{position:sticky;top:80px}
.budget-amount{font-size:32px;font-weight:800;color:var(--green)}
.budget-amount.over{color:var(--red)}
.roster-slot{display:flex;align-items:center;justify-content:space-between;padding:8px 10px;border:1px dashed var(--border);border-radius:8px;margin-bottom:6px;font-size:13px}
.roster-slot.filled{border-style:solid;background:var(--green-l);border-color:var(--green-b)}
.roster-slot .ticker{font-weight:700}
.roster-slot .price{color:var(--muted);font-size:12px}
.roster-slot .remove{cursor:pointer;color:var(--red);font-weight:700;padding:0 4px}
.section-label{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:0.05em;margin:14px 0 6px}
.search-row{display:flex;gap:8px;margin-bottom:12px}
.search-row input{flex:1;padding:10px 14px;border:1px solid var(--border);border-radius:8px;font-size:14px;font-family:'DM Sans',sans-serif}
.sector-pills{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.pill{padding:5px 12px;border-radius:20px;font-size:12px;font-weight:600;border:1px solid var(--border);background:var(--white);cursor:pointer;color:var(--muted)}
.pill.active{background:var(--text);color:var(--white);border-color:var(--text)}
.stock-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.stock-card{border:1px solid var(--border);border-radius:10px;padding:12px;cursor:pointer;background:var(--white);transition:all .12s}
.stock-card:hover{border-color:var(--green);transform:translateY(-1px)}
.stock-card.mine{background:var(--green-l);border-color:var(--green-b)}
.stock-card.disabled{opacity:.4;cursor:not-allowed}
.stock-card .tk{font-weight:800;font-size:15px}
.stock-card .nm{font-size:11px;color:var(--muted);margin:2px 0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stock-card .pr{font-weight:700;font-size:14px}
.stock-card .chg{font-size:11px;font-weight:600}
.stock-card .price-tag{display:inline-block;margin-top:6px;font-size:11px;background:var(--blue-l);color:var(--blue);padding:2px 8px;border-radius:12px;font-weight:700}
.loading{grid-column:1/-1;text-align:center;padding:40px;color:var(--muted)}
.submit-bar{position:sticky;bottom:0;background:var(--white);border-top:1px solid var(--border);padding:14px 0;margin-top:16px;display:flex;justify-content:flex-end;gap:10px}
.msg{font-size:13px;padding:10px 14px;border-radius:8px;margin-bottom:12px}
.msg.error{background:var(--red-l);color:var(--red)}
.msg.success{background:var(--green-l);color:var(--green)}
.done-banner{text-align:center;padding:60px 20px}
</style>
</head>
<body>

<nav>
  <a href="/classroom.html" class="nav-logo"><img src="/logo.jpg" alt="StockPilot"/>StockPilot <span class="nav-badge">CLASSROOM</span></a>
  <a href="/classroom.html" class="btn btn-ghost btn-sm">← Back to Class</a>
</nav>

<div class="page">
  <div id="loadingMsg" style="text-align:center;padding:60px;color:var(--muted)">Loading...</div>
  <div id="doneWrap" style="display:none"></div>
  <div id="draftWrap" style="display:none">
    <div style="margin-bottom:16px">
      <h1 style="font-size:24px;font-weight:800" id="leagueTitle"></h1>
      <p style="color:var(--muted);font-size:14px" id="leagueSubtitle"></p>
    </div>
    <div id="submitMsg" class="msg" style="display:none"></div>

    <div class="grid2">
      <div>
        <div class="card budget-box">
          <div style="font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase">Budget Remaining</div>
          <div class="budget-amount" id="budgetDisplay">$100</div>
          <div style="font-size:12px;color:var(--muted);margin-bottom:6px" id="budgetTotal"></div>

          <div class="section-label" id="startersLabel">Starters</div>
          <div id="startersList"></div>
          <div class="section-label" id="benchLabel">Bench</div>
          <div id="benchList"></div>
        </div>
      </div>

      <div>
        <div class="search-row">
          <input type="text" id="searchInput" placeholder="Search by ticker or company name..." onkeydown="if(event.key==='Enter')doSearch()">
          <button class="btn btn-ghost" onclick="doSearch()">Search</button>
        </div>
        <div class="sector-pills" id="sectorPills"></div>
        <div class="stock-grid" id="stockGrid"><div class="loading">Loading stocks...</div></div>
      </div>
    </div>

    <div class="submit-bar">
      <button class="btn btn-primary" onclick="submitDraft()" id="submitBtn">Submit My Roster</button>
    </div>
  </div>
</div>

function isTokenExpiredLocal(token){
  try{ const p = JSON.parse(atob(token.split('.')[1])); return !p.exp || p.exp*1000 < Date.now(); }
  catch(e){ return true; }
}
async function getFreshToken(){
  const stored = localStorage.getItem('supabase_token');
  if(stored && !isTokenExpiredLocal(stored)) return stored;
  const refreshToken = localStorage.getItem('supabase_refresh_token');
  if(!refreshToken) return null;
  try{
    const r = await fetch(SUPA_URL+'/auth/v1/token?grant_type=refresh_token', {
      method:'POST', headers:{'apikey':SUPA_KEY,'Content-Type':'application/json'},
      body: JSON.stringify({refresh_token: refreshToken})
    });
    if(!r.ok) return null;
    const data = await r.json();
    if(!data.access_token) return null;
    localStorage.setItem('supabase_token', data.access_token);
    if(data.refresh_token) localStorage.setItem('supabase_refresh_token', data.refresh_token);
    return data.access_token;
  }catch(e){ return null; }
}
function getUid(){
  const t = localStorage.getItem('supabase_token');
  if(!t) return null;
  try{ return JSON.parse(atob(t.split('.')[1])).sub; }catch(e){ return null; }
}
function getName(){ return localStorage.getItem('supabase_name') || localStorage.getItem('supabase_email') || 'Student'; }

async function sbGet(table, qs=''){
  const r = await fetch(SUPA_URL+'/rest/v1/'+table+(qs?'?'+qs:''), {headers:{apikey:SUPA_KEY, Authorization:'Bearer '+SUPA_KEY}});
  return r.json();
}
async function sbWrite(table, body, method='POST', extraQs=''){
  const token = await getFreshToken();
  const r = await fetch(SUPA_URL+'/rest/v1/'+table+(extraQs?'?'+extraQs:''), {
    method, headers:{apikey:SUPA_KEY, Authorization:'Bearer '+(token||SUPA_KEY), 'Content-Type':'application/json', Prefer: method==='POST'?'return=representation':'return=minimal'},
    body: JSON.stringify(body)
  });
  if(method==='POST') return r.json();
  return r.ok;
}

// ── State ──
const urlParams = new URLSearchParams(location.search);
const classId = urlParams.get('class');
let league = null;
let myRoster = { starters: [], bench: [], draft_prices: {} };
let tierData = null;

function priceFor(ticker){ return tierData?.prices?.[ticker]?.price ?? null; }

function budgetSpent(){
  let spent = 0;
  [...myRoster.starters, ...myRoster.bench].forEach(t => { spent += myRoster.draft_prices[t] || 0; });
  return spent;
}

async function init(){
  const uid = getUid();
  if(!uid || !classId){
    document.getElementById('loadingMsg').textContent = 'Open this from your class page to draft.';
    return;
  }
  try{
    const leagues = await sbGet('class_fantasy_leagues', 'class_id=eq.'+classId+'&order=created_at.desc&limit=1');
    if(!leagues.length){
      document.getElementById('loadingMsg').textContent = 'No fantasy draft has been set up for this class yet.';
      return;
    }
    league = leagues[0];

    const rosters = await sbGet('class_fantasy_rosters', 'league_id=eq.'+league.id+'&user_id=eq.'+uid);
    if(rosters.length && rosters[0].submitted){
      showDone(rosters[0]);
      return;
    }
    if(rosters.length){
      myRoster.starters = rosters[0].starters || [];
      myRoster.bench = rosters[0].bench || [];
      myRoster.draft_prices = rosters[0].draft_prices || {};
    }

    const tierRes = await fetch(BACKEND+'/api/sp500-tiers');
    tierData = await tierRes.json();

    document.getElementById('loadingMsg').style.display = 'none';
    document.getElementById('draftWrap').style.display = 'block';
    document.getElementById('leagueTitle').textContent = league.name;
    document.getElementById('leagueSubtitle').textContent = league.starters_count+' starters, '+league.bench_count+' bench \u00b7 $'+league.budget+' budget';
    document.getElementById('startersLabel').textContent = 'Starters (0/'+league.starters_count+')';
    document.getElementById('benchLabel').textContent = 'Bench (0/'+league.bench_count+')';

    if(!league.draft_open){
      document.getElementById('submitMsg').style.display = 'block';
      document.getElementById('submitMsg').className = 'msg error';
      document.getElementById('submitMsg').textContent = 'Your teacher has closed this draft.';
      document.getElementById('submitBtn').disabled = true;
    }

    renderRoster();
    renderSectorPills();
    loadPopularStocks();
  }catch(e){
    document.getElementById('loadingMsg').textContent = 'Could not load the draft - try refreshing.';
  }
}

function renderRoster(){
  document.getElementById('startersLabel').textContent = 'Starters ('+myRoster.starters.length+'/'+league.starters_count+')';
  document.getElementById('benchLabel').textContent = 'Bench ('+myRoster.bench.length+'/'+league.bench_count+')';

  const renderSlots = (arr, type) => arr.map((t,i) => `
    <div class="roster-slot filled">
      <div><span class="ticker">${t}</span> <span class="price">$${(myRoster.draft_prices[t]||0).toFixed(0)}</span></div>
      <span class="remove" onclick="removePick('${type}',${i})">\u00d7</span>
    </div>
  `).join('');
  const emptySlot = '<div class="roster-slot">Empty slot</div>';

  document.getElementById('startersList').innerHTML = renderSlots(myRoster.starters, 'starters')
    + Array(Math.max(0, league.starters_count - myRoster.starters.length)).fill(emptySlot).join('');
  document.getElementById('benchList').innerHTML = renderSlots(myRoster.bench, 'bench')
    + Array(Math.max(0, league.bench_count - myRoster.bench.length)).fill(emptySlot).join('');

  const spent = budgetSpent();
  const remaining = league.budget - spent;
  const budgetEl = document.getElementById('budgetDisplay');
  budgetEl.textContent = '$'+remaining.toFixed(0);
  budgetEl.className = 'budget-amount' + (remaining < 0 ? ' over' : '');
  document.getElementById('budgetTotal').textContent = '$'+spent.toFixed(0)+' spent of $'+league.budget;
}

function removePick(type, idx){
  myRoster[type].splice(idx, 1);
  renderRoster();
  renderStockGrid(window._lastStocks || []);
}

function isPicked(ticker){
  return myRoster.starters.includes(ticker) || myRoster.bench.includes(ticker);
}

function pickStock(ticker){
  if(isPicked(ticker)) return;
  const price = priceFor(ticker);
  if(price == null){
    showToast('This stock doesn\u2019t have a price yet - try another one.');
    return;
  }
  const spent = budgetSpent();
  if(spent + price > league.budget){
    showToast('Not enough budget left for this pick.');
    return;
  }
  if(myRoster.starters.length < league.starters_count){
    myRoster.starters.push(ticker);
  } else if(myRoster.bench.length < league.bench_count){
    myRoster.bench.push(ticker);
  } else {
    showToast('Your roster is full - remove a pick first.');
    return;
  }
  myRoster.draft_prices[ticker] = price;
  renderRoster();
  renderStockGrid(window._lastStocks || []);
}

function renderSectorPills(){
  const sectors = [...new Set(Object.values(SP500_SECTORS))].sort();
  const wrap = document.getElementById('sectorPills');
  wrap.innerHTML = '<div class="pill active" id="pill_all" onclick="filterBySector(null)">All</div>'
    + sectors.map(s => `<div class="pill" id="pill_${s.replace(/[^a-zA-Z]/g,'')}" onclick="filterBySector('${s}')">${SECTOR_ABBREV[s]||s}</div>`).join('');
}

async function setActiveSectorPill(sector){
  document.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
  const id = sector ? 'pill_'+sector.replace(/[^a-zA-Z]/g,'') : 'pill_all';
  const el = document.getElementById(id);
  if(el) el.classList.add('active');
}

async function loadPopularStocks(){
  const grid = document.getElementById('stockGrid');
  grid.innerHTML = '<div class="loading">Loading stocks...</div>';
  try{
    const res = await fetch(BACKEND+'/api/quotes?symbols='+POPULAR.join(','));
    const data = await res.json();
    const quotes = data?.quoteResponse?.result || [];
    quotes.forEach(q => { quoteCache[q.symbol] = q; });
    window._lastStocks = quotes;
    renderStockGrid(quotes);
  }catch(e){
    grid.innerHTML = '<div class="loading">Could not load stocks right now.</div>';
  }
}

async function filterBySector(sector){
  setActiveSectorPill(sector);
  if(!sector){ loadPopularStocks(); return; }
  const grid = document.getElementById('stockGrid');
  grid.innerHTML = '<div class="loading">Loading '+sector+'...</div>';
  const tickers = Object.keys(SP500_SECTORS).filter(t => SP500_SECTORS[t] === sector).sort().slice(0, 30);
  try{
    const res = await fetch(BACKEND+'/api/quotes?symbols='+tickers.join(','));
    const data = await res.json();
    const quotes = data?.quoteResponse?.result || [];
    quotes.forEach(q => { quoteCache[q.symbol] = q; });
    window._lastStocks = quotes;
    renderStockGrid(quotes);
  }catch(e){
    grid.innerHTML = '<div class="loading">Could not load '+sector+' stocks.</div>';
  }
}

async function doSearch(){
  const q = document.getElementById('searchInput').value.trim().toUpperCase();
  if(!q){ loadPopularStocks(); return; }
  const grid = document.getElementById('stockGrid');
  grid.innerHTML = '<div class="loading">Searching...</div>';
  const matches = Object.keys(SP500_SECTORS).filter(t => t.includes(q)).slice(0, 20);
  if(!matches.length){
    grid.innerHTML = '<div class="loading">No S&amp;P 500 match for "'+escapeHtml(q)+'".</div>';
    return;
  }
  try{
    const res = await fetch(BACKEND+'/api/quotes?symbols='+matches.join(','));
    const data = await res.json();
    const quotes = data?.quoteResponse?.result || [];
    quotes.forEach(q2 => { quoteCache[q2.symbol] = q2; });
    window._lastStocks = quotes;
    renderStockGrid(quotes);
  }catch(e){
    grid.innerHTML = '<div class="loading">Search failed - try again.</div>';
  }
}

function escapeHtml(s){ const d = document.createElement('div'); d.textContent = s||''; return d.innerHTML; }

let toastTimer = null;
function showToast(msg, type){
  const el = document.getElementById('submitMsg');
  el.textContent = msg;
  el.className = 'msg ' + (type || 'error');
  el.style.display = 'block';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.style.display = 'none'; }, 3000);
}

function renderStockGrid(quotes){
  const grid = document.getElementById('stockGrid');
  if(!quotes.length){ grid.innerHTML = '<div class="loading">No stocks to show.</div>'; return; }
  grid.innerHTML = quotes.map(q => {
    const chg = q.regularMarketChangePercent || 0;
    const up = chg >= 0;
    const mine = isPicked(q.symbol);
    const price = priceFor(q.symbol);
    const noPriceYet = price == null;
    return `
      <div class="stock-card ${mine?'mine':''} ${noPriceYet?'disabled':''}" data-ticker="${q.symbol}">
        <div class="tk">${q.symbol}</div>
        <div class="nm">${escapeHtml(q.shortName || q.longName || '')}</div>
        <div class="pr">$${(q.regularMarketPrice||0).toFixed(2)}</div>
        <div class="chg" style="color:${up?'var(--green)':'var(--red)'}">${up?'+':''}${chg.toFixed(2)}%</div>
        ${noPriceYet ? '<div class="price-tag" style="background:var(--red-l);color:var(--red)">No draft price yet</div>' : '<div class="price-tag">Draft: $'+price.toFixed(0)+'</div>'}
        ${mine ? '<div style="font-size:11px;color:var(--green);font-weight:700;margin-top:4px">\u2713 On your roster</div>' : ''}
      </div>
    `;
  }).join('');
  grid.querySelectorAll('.stock-card:not(.disabled)').forEach(card => {
    card.addEventListener('click', () => pickStock(card.dataset.ticker));
  });
}

async function submitDraft(){
  const total = myRoster.starters.length + myRoster.bench.length;
  const need = league.starters_count + league.bench_count;
  if(total < need){
    if(!confirm('You\u2019ve only filled '+total+' of '+need+' slots. Submit anyway?')) return;
  }
  const btn = document.getElementById('submitBtn');
  btn.textContent = 'Submitting...'; btn.disabled = true;
  try{
    const uid = getUid();
    await sbWrite('class_fantasy_rosters', {
      league_id: league.id, user_id: uid, nickname: getName(),
      starters: myRoster.starters, bench: myRoster.bench, draft_prices: myRoster.draft_prices,
      submitted: true, submitted_at: new Date().toISOString()
    }, 'POST', 'on_conflict=league_id,user_id');
    showDone({ starters: myRoster.starters, bench: myRoster.bench, draft_prices: myRoster.draft_prices });
  }catch(e){
    document.getElementById('submitMsg').style.display = 'block';
    document.getElementById('submitMsg').className = 'msg error';
    document.getElementById('submitMsg').textContent = 'Could not submit - try again.';
    btn.textContent = 'Submit My Roster'; btn.disabled = false;
  }
}

function showDone(roster){
  document.getElementById('loadingMsg').style.display = 'none';
  document.getElementById('draftWrap').style.display = 'none';
  const wrap = document.getElementById('doneWrap');
  wrap.style.display = 'block';
  const picks = [...(roster.starters||[]), ...(roster.bench||[])];
  wrap.innerHTML = `
    <div class="done-banner">
      <div style="font-size:40px;margin-bottom:10px">\u2705</div>
      <h1 style="font-size:22px;margin-bottom:8px">Your roster is submitted</h1>
      <p style="color:var(--muted);margin-bottom:24px">Your teacher can see your picks and how they're doing on the class Fantasy tab.</p>
      <div class="card" style="max-width:400px;margin:0 auto;text-align:left">
        <div style="font-weight:700;margin-bottom:10px">Your Roster</div>
        ${picks.map(t => `<div class="roster-slot filled"><span class="ticker">${t}</span><span class="price">$${(roster.draft_prices?.[t]||0).toFixed(0)}</span></div>`).join('')}
      </div>
    </div>
  `;
}
