<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" type="image/jpeg" href="https://mystockspilot.com/logo.jpg"/>
<link rel="apple-touch-icon" href="https://mystockspilot.com/logo.jpg"/>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bullpen Showdown | StockPilot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --green:#3fb27f;--green-d:#2f8f65;--red:#e8432b;--gold:#2979ff;--blue:#2979ff;
  --bg:#0b100c;--bg2:#0f1712;--bg3:#141d17;--border:rgba(242,237,224,0.14);
  --text:#f2ede0;--muted:#9a9686;--card:rgba(242,237,224,0.035);
}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:'IBM Plex Sans',sans-serif;min-height:100vh;padding-top:76px}

.bp-nav{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:16px 32px;background:rgba(8,12,16,0.9);backdrop-filter:blur(16px);border-bottom:1px solid var(--border)}
.bp-logo{display:flex;align-items:center;gap:10px;text-decoration:none}
.bp-logo-mark{width:36px;height:36px;border-radius:3px;background:linear-gradient(135deg,var(--blue),var(--green));display:flex;align-items:center;justify-content:center;font-family:'Anton',sans-serif;font-size:20px;color:#000}
.bp-logo-text{font-family:'Anton',sans-serif;font-size:22px;letter-spacing:2px;color:var(--text)}
.bp-logo-sub{font-size:10px;color:var(--muted);letter-spacing:1px;text-transform:uppercase;margin-top:2px}
.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--muted);padding:8px 18px;border-radius:3px;font-size:13px;cursor:pointer;font-family:'IBM Plex Sans',sans-serif}
.btn-ghost:hover{border-color:var(--blue);color:var(--blue)}

.wrap{max-width:960px;margin:0 auto;padding:24px 20px 80px}
.t-header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:24px}
.t-name{font-family:'Anton',sans-serif;font-size:32px;letter-spacing:1px}
.t-meta{font-size:13px;color:var(--muted);margin-top:2px}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--border);padding:6px 14px;border-radius:100px;font-size:12px;font-weight:600}
.pill.blue{border-color:rgba(41,121,255,0.4);color:var(--blue)}
.pill.gold{border-color:rgba(255,214,0,0.4);color:var(--gold)}
.pill.red{border-color:rgba(255,23,68,0.4);color:var(--red)}

.card{background:var(--card);border:1px solid var(--border);border-radius:4px;padding:22px;margin-bottom:20px}
.card h2{font-family:'Anton',sans-serif;font-size:20px;letter-spacing:0.5px;margin-bottom:16px}

.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px}
.stat-box{background:var(--bg3);border:1px solid var(--border);border-radius:3px;padding:16px;text-align:center}
.stat-box .v{font-family:'IBM Plex Mono',monospace;font-size:22px;font-weight:600}
.stat-box .l{font-size:11px;color:var(--muted);text-transform:uppercase;margin-top:4px}

.table-standings{width:100%;border-collapse:collapse}

.vs-grid{display:grid;grid-template-columns:1fr auto 1fr;gap:16px;align-items:center}
.vs-side{text-align:center;padding:18px 12px;border-radius:6px;border:1px solid var(--border);background:var(--bg3)}
.vs-side.leading{border-color:var(--blue);box-shadow:0 0 0 1px var(--blue)}
.vs-side .crown{font-size:20px;margin-bottom:4px}
.vs-name{font-weight:700;font-size:15px;margin-bottom:6px}
.vs-name .you-tag{font-size:11px;color:var(--blue);font-weight:600}
.vs-pct{font-family:'IBM Plex Mono',monospace;font-size:28px;font-weight:700}
.vs-cash{font-size:12px;color:var(--muted);margin-top:4px}
.vs-divider{font-family:'Anton',sans-serif;font-size:18px;color:var(--muted);letter-spacing:1px}
@media(max-width:520px){.vs-grid{grid-template-columns:1fr;gap:10px}.vs-divider{display:none}}
.table-standings th{text-align:left;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;padding:8px;border-bottom:1px solid var(--border)}
.table-standings td{padding:12px 8px;border-bottom:1px solid var(--border);font-size:14px}
.table-standings tr.me{background:rgba(41,121,255,0.08)}
.rank-badge{width:24px;height:24px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;background:var(--bg3)}
.rank-badge.top3{background:rgba(255,214,0,0.15);color:var(--gold)}
.return-up{color:var(--green);font-weight:700}
.return-down{color:var(--red);font-weight:700}

.trade-row{display:grid;grid-template-columns:1fr 100px auto auto;gap:10px;margin-bottom:14px}
.trade-row input{background:var(--bg3);border:1px solid var(--border);border-radius:3px;padding:10px 12px;color:var(--text);font-size:14px;font-family:'IBM Plex Sans',sans-serif}
.trade-row input:focus{outline:none;border-color:var(--blue)}
.btn-buy{background:var(--green);border:none;color:#000;padding:10px 16px;border-radius:3px;font-weight:700;cursor:pointer;font-size:13px}
.btn-sell{background:var(--red);border:none;color:#fff;padding:10px 16px;border-radius:3px;font-weight:700;cursor:pointer;font-size:13px}
.quote-preview{font-size:12px;color:var(--muted);margin-bottom:14px;min-height:16px}
.pct-row{display:flex;gap:8px;margin-top:10px;align-items:center;flex-wrap:wrap}
.pct-btn{background:var(--bg3);border:1px solid var(--border);color:var(--text);padding:6px 14px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif}
.pct-btn:hover{border-color:var(--blue);color:var(--blue)}
.trade-feed-row{padding:9px 0;border-bottom:1px solid var(--border);font-size:13px}
.trade-feed-row:last-child{border-bottom:none}

.holding-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);font-size:14px}
.holding-row:last-child{border-bottom:none}

.empty-state{text-align:center;padding:60px 20px;color:var(--muted)}
.loading{text-align:center;padding:80px 20px;color:var(--muted)}
.chart-wrap{margin:14px 0 4px;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.07);border-radius:12px;padding:14px 16px 10px}
.chart-ranges{display:flex;gap:4px;margin-bottom:10px}
.chart-range-btn{font-size:11px;font-weight:600;padding:4px 10px;border-radius:6px;border:none;cursor:pointer;font-family:'DM Sans',sans-serif;background:transparent;color:rgba(255,255,255,0.35);transition:all 0.15s}
.chart-range-btn:hover{background:rgba(255,255,255,0.06);color:rgba(255,255,255,0.7)}
.chart-range-btn.active{background:rgba(255,255,255,0.1);color:#fff}
.chart-canvas-wrap{position:relative;width:100%;height:140px}
.chart-canvas-wrap canvas{width:100%!important;height:140px!important}
.chart-loading{display:flex;align-items:center;justify-content:center;height:140px;color:rgba(255,255,255,0.2);font-size:13px}
@media(max-width:600px){.chart-canvas-wrap{height:110px}.chart-canvas-wrap canvas{height:110px!important}}
</style>
</head>
<body>

<nav class="bp-nav">
  <a href="/bullpen-showdown.html" class="bp-logo">
    <img src="/logo.jpg" alt="StockPilot" style="height:36px;width:36px;border-radius:3px;object-fit:cover"/>
    <div><div class="bp-logo-text">STOCKPILOT</div><div class="bp-logo-sub">Bullpen Showdown</div></div>
  </a>
  <div style="display:flex;align-items:center;gap:10px">
    <a href="/bullpen-showdown.html" class="btn-ghost" style="text-decoration:none">← All Showdowns</a>
    <a href="/my-account.html" class="btn-ghost" style="text-decoration:none">👤 My Account</a>
  </div>
</nav>

<div class="wrap" id="app">
  <div class="loading">Loading showdown...</div>
</div>

<script src="/bullpen-shared.js"></script>
<script>
const BACKEND = 'https://stockpilot-production-c94f.up.railway.app';
const params = new URLSearchParams(window.location.search);
const code = (params.get('code') || '').toUpperCase();
const token = localStorage.getItem('supabase_token');
const myUid = token ? JSON.parse(atob(token.split('.')[1])).sub : null;
const myName = localStorage.getItem('bshowdown_my_name') || localStorage.getItem('supabase_name') || '';

let tournament = null, entries = [], myEntry = null;
let priceCache = {};

async function getPrice(ticker){
  if(priceCache[ticker] !== undefined) return priceCache[ticker];
  try{
    const res = await fetch(`${BACKEND}/api/quotes?symbols=${ticker}`);
    const data = await res.json();
    const price = data?.quoteResponse?.result?.[0]?.regularMarketPrice || 0;
    priceCache[ticker] = price;
    return price;
  }catch(e){ return 0; }
}

function isPastEndDate(){
  return tournament.end_date <= new Date().toISOString().split('T')[0];
}

async function load(){
  if(!code){ document.getElementById('app').innerHTML = '<div class="empty-state">No showdown code given.</div>'; return; }
  const tourneys = await sbGet('bullpen_showdown_tournaments', 'code=eq.'+code);
  tournament = tourneys[0];
  if(!tournament){ document.getElementById('app').innerHTML = '<div class="empty-state">Showdown not found.</div>'; return; }

  entries = await sbGet('bullpen_showdown_entries', 'tournament_id=eq.'+tournament.id);
  myEntry = entries.find(e => (myUid && e.user_id === myUid) || e.nickname === myName) || null;

  if(tournament.status === 'completed' || isPastEndDate()) await renderCompleted();
  else await renderActive();
}

function isCommissioner(){
  return myEntry && (tournament.commissioner_name === myEntry.nickname);
}

async function computeLiveValues(){
  const withValues = [];
  for(const e of entries){
    let value = e.cash;
    for(const [ticker, shares] of Object.entries(e.holdings || {})){
      value += shares * await getPrice(ticker);
    }
    const pct = (value - e.starting_cash) / e.starting_cash * 100;
    withValues.push({...e, liveValue: value, livePct: pct});
  }
  withValues.sort((a,b) => b.livePct - a.livePct);
  return withValues;
}

async function getMyEquity(){
  let value = myEntry.cash;
  for(const [ticker, shares] of Object.entries(myEntry.holdings || {})){
    value += shares * await getPrice(ticker);
  }
  return value;
}

// Reg T standard: 50% initial margin, i.e. up to 2x equity in
// position value - same rule as the proven Virtual Market
// implementation this was ported from.
async function getShowdownBuyingPower(){
  if(!myEntry.margin_enabled) return myEntry.cash;
  const equity = await getMyEquity();
  return Math.max(myEntry.cash, equity * 2);
}

function toggleShowdownMargin(){
  myEntry.margin_enabled = document.getElementById('showdownMarginToggle').checked;
  sbPatch('bullpen_showdown_entries', 'id=eq.'+myEntry.id, {margin_enabled: myEntry.margin_enabled});
  if(myEntry.margin_enabled){
    showToast('⚠️ Margin trading enabled - you can now buy beyond your cash, but losses are magnified and you can owe more than you have.', 'error');
  }
  updateShowdownMarginStatus();
}

async function updateShowdownMarginStatus(){
  const el = document.getElementById('showdownMarginStatus');
  if(!el) return;
  if(!myEntry.margin_enabled){ el.style.display = 'none'; return; }
  const equity = await getMyEquity();
  const buyingPower = await getShowdownBuyingPower();
  const marginUsed = Math.max(0, -myEntry.cash);
  el.style.display = 'block';
  el.innerHTML = `Equity: $${equity.toFixed(2)} · Buying power: $${buyingPower.toFixed(2)}` + (marginUsed > 0 ? ` · <strong>Margin used: $${marginUsed.toFixed(2)}</strong>` : '');
}

// Warns (never auto-liquidates) when equity falls below the standard
// 25% maintenance margin requirement relative to total position
// value - same deliberate design as Virtual Market: an automated
// forced-sell is real money-moving logic with real risk of a bug
// doing the wrong thing to someone's portfolio, so this stays a
// warning by design.
let lastShowdownMarginWarning = 0;
async function checkShowdownMarginCall(){
  if(!myEntry.margin_enabled || myEntry.cash >= 0) return;
  const equity = await getMyEquity();
  const positionValue = equity - myEntry.cash;
  if(positionValue <= 0) return;
  const maintenanceRatio = equity / positionValue;
  if(maintenanceRatio < 0.25 && Date.now() - lastShowdownMarginWarning > 60000){
    showToast('🚨 MARGIN CALL: your equity ($'+equity.toFixed(2)+') has fallen below the 25% maintenance requirement on your position. Add cash or reduce positions.', 'error');
    lastShowdownMarginWarning = Date.now();
  }
}

// Ported from Virtual Market's checkPendingOrders, adapted for
// Showdown's simpler holdings model (a flat {ticker: shares} object
// rather than a position object with avg cost - Showdown doesn't
// track cost basis, so this stays lean).
async function checkShowdownPendingOrders(){
  if(!myEntry.orders || !myEntry.orders.length) return;
  const remaining = [];
  let anyFilled = false;
  let holdings = {...(myEntry.holdings || {})};
  let cash = myEntry.cash;

  for(const o of myEntry.orders){
    const price = await getPrice(o.ticker).catch(() => null);
    if(!price){ remaining.push(o); continue; }

    let triggered = false;
    if(o.type === 'limit' && o.side === 'buy') triggered = price <= o.triggerPrice;
    else if(o.type === 'limit' && o.side === 'sell') triggered = price >= o.triggerPrice;
    else if(o.type === 'stop_loss') triggered = price <= o.triggerPrice;
    else if(o.type === 'take_profit') triggered = price >= o.triggerPrice;

    if(!triggered){ remaining.push(o); continue; }

    const total = o.shares * price;
    if(o.side === 'buy'){
      if(total > cash){ remaining.push(o); continue; } // can't afford it yet, keep waiting
      cash -= total;
      holdings[o.ticker] = (holdings[o.ticker] || 0) + o.shares;
    } else {
      const currentHolding = holdings[o.ticker] || 0;
      if(currentHolding < o.shares){ continue; } // position changed since order was placed - drop it rather than oversell
      holdings[o.ticker] = currentHolding - o.shares;
      if(holdings[o.ticker] === 0) delete holdings[o.ticker];
      cash += total;
      // A filled stop-loss/take-profit should cancel any sibling
      // protective order on the same ticker, since the shares it was
      // covering are gone.
      if(o.type === 'stop_loss' || o.type === 'take_profit'){
        for(let i = remaining.length - 1; i >= 0; i--){
          if(remaining[i].ticker === o.ticker && (remaining[i].type === 'stop_loss' || remaining[i].type === 'take_profit')) remaining.splice(i, 1);
        }
      }
    }
    anyFilled = true;
    const typeLabel = {limit: 'Limit order', stop_loss: 'Stop loss', take_profit: 'Take profit'}[o.type] || 'Order';
    showToast(`✅ ${typeLabel} filled: ${o.side} ${o.shares} ${o.ticker} @ $${price.toFixed(2)}`, 'success');
  }

  if(anyFilled){
    await sbPatch('bullpen_showdown_entries', 'id=eq.'+myEntry.id, {cash, holdings, orders: remaining});
    myEntry.cash = cash; myEntry.holdings = holdings; myEntry.orders = remaining;
    renderShowdownPendingOrders();
  } else if(remaining.length !== myEntry.orders.length){
    myEntry.orders = remaining;
  }
}

async function cancelShowdownOrder(orderId){
  const orders = (myEntry.orders || []).filter(o => o.id !== orderId);
  await sbPatch('bullpen_showdown_entries', 'id=eq.'+myEntry.id, {orders});
  myEntry.orders = orders;
  showToast('Order cancelled', 'success');
  renderShowdownPendingOrders();
}

function renderShowdownPendingOrders(){
  const el = document.getElementById('showdownPendingOrders');
  if(!el) return;
  const orders = myEntry.orders || [];
  if(!orders.length){ el.innerHTML = ''; return; }
  const typeLabel = {limit: 'Limit', stop_loss: 'Stop Loss', take_profit: 'Take Profit'};
  el.innerHTML = `<div style="margin-bottom:14px">
    <div style="font-size:12px;font-weight:600;color:var(--muted);margin-bottom:6px">⏳ Pending Orders</div>
    ${orders.map(o => `
      <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 10px;background:var(--bg3);border:1px solid var(--border);border-radius:8px;margin-bottom:6px;font-size:12px">
        <span>${o.side === 'buy' ? '🟢' : '🔴'} ${typeLabel[o.type] || o.type} · ${o.shares} ${escapeHtml(o.ticker)} @ $${o.triggerPrice.toFixed(2)}</span>
        <button onclick="cancelShowdownOrder('${o.id}')" style="background:transparent;border:1px solid var(--border);border-radius:6px;color:var(--muted);padding:3px 8px;cursor:pointer;font-size:11px">Cancel</button>
      </div>
    `).join('')}
  </div>`;
}

async function createShowdownPriceAlert(){
  const ticker = document.getElementById('showdownAlertTicker').value.trim().toUpperCase();
  const direction = document.getElementById('showdownAlertDirection').value;
  const target = parseFloat(document.getElementById('showdownAlertPrice').value);
  if(!ticker){ showToast('Enter a ticker', 'error'); return; }
  if(!target || target <= 0){ showToast('Enter a target price', 'error'); return; }
  const alerts = [...(myEntry.price_alerts || [])];
  alerts.push({
    id: 'alert_'+Date.now()+'_'+Math.random().toString(36).slice(2,7),
    ticker, direction, targetPrice: target, createdAt: new Date().toISOString()
  });
  await sbPatch('bullpen_showdown_entries', 'id=eq.'+myEntry.id, {price_alerts: alerts});
  myEntry.price_alerts = alerts;
  showToast(`🔔 Alert set for ${ticker} ${direction} $${target.toFixed(2)}`, 'success');
  document.getElementById('showdownAlertTicker').value = '';
  document.getElementById('showdownAlertPrice').value = '';
  renderShowdownAlerts();
}

async function cancelShowdownPriceAlert(alertId){
  const alerts = (myEntry.price_alerts || []).filter(a => a.id !== alertId);
  await sbPatch('bullpen_showdown_entries', 'id=eq.'+myEntry.id, {price_alerts: alerts});
  myEntry.price_alerts = alerts;
  showToast('Alert cancelled', 'success');
  renderShowdownAlerts();
}

function renderShowdownAlerts(){
  const el = document.getElementById('showdownAlertsList');
  if(!el) return;
  const alerts = myEntry.price_alerts || [];
  if(!alerts.length){ el.innerHTML = ''; return; }
  el.innerHTML = alerts.map(a => `
    <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 10px;background:var(--bg2);border:1px solid var(--border);border-radius:8px;margin-top:6px;font-size:12px">
      <span>${a.ticker} ${a.direction === 'above' ? '↑ above' : '↓ below'} $${a.targetPrice.toFixed(2)}</span>
      <button onclick="cancelShowdownPriceAlert('${a.id}')" style="background:transparent;border:1px solid var(--border);border-radius:6px;color:var(--muted);padding:3px 8px;cursor:pointer;font-size:11px">Cancel</button>
    </div>
  `).join('');
}

async function checkShowdownPriceAlerts(){
  const alerts = myEntry.price_alerts || [];
  if(!alerts.length) return;
  const tickers = [...new Set(alerts.map(a => a.ticker))];
  const priceMap = {};
  for(const t of tickers){ priceMap[t] = await getPrice(t).catch(() => null); }

  const remaining = [];
  let anyFired = false;
  for(const a of alerts){
    const price = priceMap[a.ticker];
    if(!price){ remaining.push(a); continue; }
    const triggered = a.direction === 'above' ? price >= a.targetPrice : price <= a.targetPrice;
    if(!triggered){ remaining.push(a); continue; }
    showToast(`🔔 ${a.ticker} is now ${a.direction === 'above' ? 'above' : 'below'} $${a.targetPrice.toFixed(2)} - currently $${price.toFixed(2)}`, 'success');
    anyFired = true;
  }
  if(anyFired){
    myEntry.price_alerts = remaining;
    await sbPatch('bullpen_showdown_entries', 'id=eq.'+myEntry.id, {price_alerts: remaining});
    renderShowdownAlerts();
  }
}

function populateShowdownProtectDropdown(){
  const sel = document.getElementById('showdownProtectTicker');
  if(!sel) return;
  const tickers = Object.keys(myEntry.holdings || {}).filter(t => myEntry.holdings[t] > 0);
  if(!tickers.length){ document.getElementById('showdownProtectRow').style.display = 'none'; return; }
  document.getElementById('showdownProtectRow').style.display = 'block';
  sel.innerHTML = tickers.map(t => `<option value="${t}">${t} (${myEntry.holdings[t]} sh)</option>`).join('');
}

async function setShowdownProtection(){
  const ticker = document.getElementById('showdownProtectTicker').value;
  const stopLoss = parseFloat(document.getElementById('showdownStopLoss').value) || 0;
  const takeProfit = parseFloat(document.getElementById('showdownTakeProfit').value) || 0;
  if(!ticker){ showToast('No position selected.', 'error'); return; }
  if(stopLoss <= 0 && takeProfit <= 0){ showToast('Enter a stop loss or take profit price.', 'error'); return; }
  const shares = myEntry.holdings[ticker];
  const orders = [...(myEntry.orders || [])];
  if(stopLoss > 0) orders.push({id: 'ord_'+Date.now()+'_sl', type: 'stop_loss', side: 'sell', ticker, shares, triggerPrice: stopLoss, createdAt: new Date().toISOString()});
  if(takeProfit > 0) orders.push({id: 'ord_'+Date.now()+'_tp', type: 'take_profit', side: 'sell', ticker, shares, triggerPrice: takeProfit, createdAt: new Date().toISOString()});
  await sbPatch('bullpen_showdown_entries', 'id=eq.'+myEntry.id, {orders});
  myEntry.orders = orders;
  showToast('Protection set for '+ticker, 'success');
  document.getElementById('showdownStopLoss').value = '';
  document.getElementById('showdownTakeProfit').value = '';
  renderShowdownPendingOrders();
}

function buildStandingsCard(withValues, myEntryId, opts){
  opts = opts || {};
  const listHeading = opts.listHeading || '🏆 Leaderboard';
  const vsHeading = opts.vsHeading || '⚔️ Head to Head';
  if(withValues.length !== 2){
    return `
    <div class="card">
      <h2>${listHeading}</h2>
      <table class="table-standings">
        <thead><tr><th>#</th><th>Player</th><th style="text-align:right">Return</th></tr></thead>
        <tbody>
          ${withValues.map((e,i) => `
            <tr class="${myEntryId===e.id?'me':''}">
              <td><span class="rank-badge ${i<3?'top3':''}">${i+1}</span></td>
              <td>${escapeHtml(e.nickname)}${myEntryId===e.id?' (you)':''}</td>
              <td style="text-align:right" class="${e.livePct>=0?'return-up':'return-down'}">${e.livePct>=0?'+':''}${e.livePct.toFixed(2)}%</td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    </div>`;
  }

  const sideHtml = (entry, isMe, leading) => `
    <div class="vs-side${leading && !tied ? ' leading' : ''}">

    </div>`;

  return `
    <div class="card">
      <h2>${vsHeading}</h2>
      <div class="vs-grid">
        ${sideHtml(me, true, meLeading)}

    </div>`;
}

async function getHistory(ticker){
  try{
    const res = await fetch(`${BACKEND}/api/history?symbol=${ticker}&range=5d&interval=1d`);
    const data = await res.json();
    const result = data?.chart?.result?.[0];
    return (result?.indicators?.quote?.[0]?.close || []).filter(c => c != null);
  }catch(e){ return []; }
}

function sparklineSvg(closes){
  if(closes.length < 2) return '';
  const width=110, height=32;
  const min = Math.min(...closes), max = Math.max(...closes);
  const range = (max - min) || 1;
  const points = closes.map((c,i) => {
    const x = (i/(closes.length-1)) * width;
    const y = height - ((c-min)/range) * height;
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(' ');
  const up = closes[closes.length-1] >= closes[0];
  const color = up ? 'var(--green)' : 'var(--red)';
  return `<svg width="${width}" height="${height}" viewBox="0 0 ${width} ${height}"><polyline points="${points}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></svg>`;
}

// Computes real win rate / avg gain-loss / trade count from the
// existing trade log via FIFO matching, so no changes were needed to
// how holdings or trades are stored elsewhere - this only reads what
// was already being logged. Handles both long and short round trips:
// a sell matches against open long lots first (realizing long P&L),
// any excess opens a short lot; a buy matches against open short
// lots first (realizing short P&L), any excess opens a long lot.
async function computeShowdownTradeStats(entryId){
  const trades = await sbGet('bullpen_showdown_trades', `entry_id=eq.${entryId}&order=created_at.asc`);
  const openLots = {}; // ticker -> [{shares, price, isLong}]
  const closedTrades = []; // {ticker, pctReturn}

  for(const t of trades){
    if(!openLots[t.ticker]) openLots[t.ticker] = [];
    const lots = openLots[t.ticker];
    let remaining = t.shares;

    if(t.action === 'buy'){
      // Close short lots first
      while(remaining > 0 && lots.length && !lots[0].isLong){
        const lot = lots[0];
        const matched = Math.min(remaining, lot.shares);
        const pctReturn = ((lot.price - t.price) / lot.price) * 100; // short profits when price drops
        closedTrades.push({ticker: t.ticker, pctReturn});
        lot.shares -= matched; remaining -= matched;
        if(lot.shares <= 0) lots.shift();
      }
      if(remaining > 0) lots.push({shares: remaining, price: t.price, isLong: true});
    } else {
      // Close long lots first
      while(remaining > 0 && lots.length && lots[0].isLong){
        const lot = lots[0];
        const matched = Math.min(remaining, lot.shares);
        const pctReturn = ((t.price - lot.price) / lot.price) * 100;
        closedTrades.push({ticker: t.ticker, pctReturn});
        lot.shares -= matched; remaining -= matched;
        if(lot.shares <= 0) lots.shift();
      }
      if(remaining > 0) lots.push({shares: remaining, price: t.price, isLong: false});
    }
  }

  const wins = closedTrades.filter(c => c.pctReturn > 0);
  const losses = closedTrades.filter(c => c.pctReturn <= 0);
  return {
    totalTrades: trades.length,
    closedTrades: closedTrades.length,
    winRate: closedTrades.length ? (wins.length / closedTrades.length) * 100 : null,
    avgGain: wins.length ? wins.reduce((s,c) => s+c.pctReturn, 0) / wins.length : null,
    avgLoss: losses.length ? losses.reduce((s,c) => s+c.pctReturn, 0) / losses.length : null
  };
}

// Ported directly from Virtual Market's proven chart implementation,
// adapted to use Showdown's BACKEND variable and its own element IDs
// (priceChartWrap / showdownPriceChart) so it doesn't collide with
// anything on this page.
var _showdownChartCache = {};
async function loadShowdownChart(symbol, range, interval, btnEl) {
  if(!symbol) return;
  if(btnEl) {
    document.querySelectorAll('.chart-range-btn').forEach(function(b){ b.classList.remove('active'); });
    btnEl.classList.add('active');
  }
  var wrap = document.getElementById('priceChartWrap');
  if(!wrap) return;
  var canvasWrap = wrap.querySelector('.chart-canvas-wrap');
  if(!canvasWrap) return;
  canvasWrap.innerHTML = '<div class="chart-loading">Loading...</div>';

  var cacheKey = symbol + '_' + range;
  var pts, times;
  try {
    if(!_showdownChartCache[cacheKey]) {
      var res = await fetch(BACKEND + '/api/history?symbol=' + symbol + '&range=' + range + '&interval=' + interval);
      var data = await res.json();
      var result = data && data.chart && data.chart.result && data.chart.result[0];
      if(!result) throw new Error('No data');
      var closes = result.indicators.quote[0].close;
      var timestamps = result.timestamp;
      var valid = timestamps.map(function(t,i){ return {t:t, p:closes[i]}; }).filter(function(x){ return x.p != null; });
      _showdownChartCache[cacheKey] = valid;
    }
    var valid = _showdownChartCache[cacheKey];
    pts = valid.map(function(x){ return x.p; });
    times = valid.map(function(x){ return x.t; });
  } catch(e) {
    canvasWrap.innerHTML = '<div class="chart-loading">Chart unavailable</div>';
    return;
  }

  if(!pts.length) { canvasWrap.innerHTML = '<div class="chart-loading">No data</div>'; return; }

  var isUp = pts[pts.length-1] >= pts[0];
  var lineColor = isUp ? '#86efac' : '#fca5a5';
  var gradColor = isUp ? 'rgba(134,239,172,' : 'rgba(252,165,165,';

  var canvas = document.createElement('canvas');
  canvas.id = 'showdownPriceChart';
  canvasWrap.innerHTML = '';
  canvasWrap.appendChild(canvas);

  var dpr = window.devicePixelRatio || 1;
  var W = canvasWrap.offsetWidth || 400;
  var H = 140;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';

  var ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);

  var pad = {top:10, right:10, bottom:26, left:54};
  var cw = W - pad.left - pad.right;
  var ch = H - pad.top - pad.bottom;

  var minP = Math.min.apply(null, pts) * 0.999;
  var maxP = Math.max.apply(null, pts) * 1.001;

  function toX(i){ return pad.left + (i/(pts.length-1))*cw; }
  function toY(p){ return pad.top + ch - ((p-minP)/(maxP-minP))*ch; }

  ctx.strokeStyle = 'rgba(255,255,255,0.05)';
  ctx.lineWidth = 1;
  for(var i=0;i<=3;i++){
    var gy = pad.top + (ch/3)*i;
    ctx.beginPath(); ctx.moveTo(pad.left,gy); ctx.lineTo(pad.left+cw,gy); ctx.stroke();
  }

  var grad = ctx.createLinearGradient(0,pad.top,0,pad.top+ch);
  grad.addColorStop(0, gradColor+'0.2)');
  grad.addColorStop(1, gradColor+'0)');
  ctx.beginPath();
  ctx.moveTo(toX(0), toY(pts[0]));
  for(var j=1;j<pts.length;j++) ctx.lineTo(toX(j), toY(pts[j]));
  ctx.lineTo(toX(pts.length-1), H-pad.bottom+2);
  ctx.lineTo(toX(0), H-pad.bottom+2);
  ctx.closePath();
  ctx.fillStyle = grad;
  ctx.fill();

  ctx.beginPath();
  ctx.moveTo(toX(0), toY(pts[0]));
  for(var k=1;k<pts.length;k++) ctx.lineTo(toX(k), toY(pts[k]));
  ctx.strokeStyle = lineColor;
  ctx.lineWidth = 2;
  ctx.lineJoin = 'round';
  ctx.stroke();

  ctx.fillStyle = 'rgba(255,255,255,0.3)';
  ctx.font = '10px "DM Mono", monospace';
  ctx.textAlign = 'right';
  ctx.textBaseline = 'middle';
  [0, 0.5, 1].forEach(function(f){
    var p = minP + (maxP-minP)*(1-f);
    var label = p > 100 ? '$'+Math.round(p) : '$'+p.toFixed(2);
    ctx.fillText(label, pad.left-4, pad.top + ch*f);
  });

  ctx.textAlign = 'center';
  ctx.textBaseline = 'alphabetic';
  [0, 0.5, 1].forEach(function(f){
    var idx = Math.floor(f*(times.length-1));
    var dt = new Date(times[idx]*1000);
    var label = range==='5d'
      ? dt.toLocaleDateString('en-US',{weekday:'short',month:'numeric',day:'numeric'})
      : dt.toLocaleDateString('en-US',{month:'short',day:'numeric'});
    ctx.fillStyle = 'rgba(255,255,255,0.2)';
    ctx.font = '10px "DM Sans", sans-serif';
    ctx.fillText(label, toX(idx), H-4);
  });

  ctx.beginPath();
  ctx.arc(toX(pts.length-1), toY(pts[pts.length-1]), 3, 0, Math.PI*2);
  ctx.fillStyle = lineColor;
  ctx.fill();
}

// ── Options (Black-Scholes) ──
// Same real-data engine as trade.html: real spot price, real historical
// volatility, real current 10-Year Treasury rate as the risk-free rate.
let showdownOptionType = 'call';
let riskFreeRateCache = null, riskFreeRateCacheTime = 0;
async function getRiskFreeRate(){
  if(riskFreeRateCache !== null && Date.now() - riskFreeRateCacheTime < 3600000) return riskFreeRateCache;
  try{
    const res = await fetch(`${BACKEND}/api/macro`);
    const data = await res.json();
    const dgs10 = data?.series?.find(s => s.id === 'DGS10');
    riskFreeRateCache = dgs10?.latest?.value ? dgs10.latest.value / 100 : 0.045;
  }catch(e){ riskFreeRateCache = 0.045; }
  riskFreeRateCacheTime = Date.now();
  return riskFreeRateCache;
}
let volatilityCache = {};
async function getHistoricalVolatility(symbol){
  if(volatilityCache[symbol] !== undefined) return volatilityCache[symbol];
  try{
    const res = await fetch(`${BACKEND}/api/history?symbol=${symbol}&range=3mo&interval=1d`);
    const data = await res.json();
    const closes = (data?.chart?.result?.[0]?.indicators?.quote?.[0]?.close || []).filter(c => c != null);
    if(closes.length < 10){ volatilityCache[symbol] = 0.35; return 0.35; }
    const logReturns = [];
    for(let i=1;i<closes.length;i++) logReturns.push(Math.log(closes[i]/closes[i-1]));
    const mean = logReturns.reduce((a,b)=>a+b,0) / logReturns.length;
    const variance = logReturns.reduce((a,b)=>a+(b-mean)*(b-mean),0) / (logReturns.length-1);
    const annualizedVol = Math.sqrt(variance) * Math.sqrt(252);
    volatilityCache[symbol] = annualizedVol;
    return annualizedVol;
  }catch(e){ volatilityCache[symbol] = 0.35; return 0.35; }
}
function normCDF(x){
  const a1=0.254829592, a2=-0.284496736, a3=1.421413741, a4=-1.453152027, a5=1.061405429, p=0.3275911;
  const sign = x < 0 ? -1 : 1;
  x = Math.abs(x) / Math.sqrt(2);
  const t = 1/(1+p*x);
  const y = 1 - (((((a5*t+a4)*t)+a3)*t+a2)*t+a1)*t*Math.exp(-x*x);
  return 0.5*(1+sign*y);
}
function blackScholes(S, K, T, r, sigma, type){
  if(T <= 0) return type==='call' ? Math.max(0, S-K) : Math.max(0, K-S);
  const d1 = (Math.log(S/K) + (r + sigma*sigma/2)*T) / (sigma*Math.sqrt(T));
  const d2 = d1 - sigma*Math.sqrt(T);
  if(type === 'call') return S*normCDF(d1) - K*Math.exp(-r*T)*normCDF(d2);
  return K*Math.exp(-r*T)*normCDF(-d2) - S*normCDF(-d1);
}
async function getOptionPremium(symbol, spotPrice, strike, expirationDate, type){
  const now = new Date();
  const exp = new Date(expirationDate+'T16:00:00');
  const T = Math.max(0, (exp - now) / (365.25*24*60*60*1000));
  const [r, sigma] = await Promise.all([getRiskFreeRate(), getHistoricalVolatility(symbol)]);
  return {premium: Math.max(0.01, blackScholes(spotPrice, strike, T, r, sigma, type)), T, r, sigma};
}

function setShowdownOptionType(t){
  showdownOptionType = t;
  document.getElementById('optTypeCall').style.opacity = t==='call' ? '1' : '0.5';
  document.getElementById('optTypePut').style.opacity = t==='put' ? '1' : '0.5';
  updateShowdownOptionSummary();
}

let showdownOptDebounce = null;
async function updateShowdownOptionSummary(){
  const ticker = document.getElementById('optTicker').value.trim().toUpperCase();
  const strike = parseFloat(document.getElementById('optStrike').value);
  const days = parseInt(document.getElementById('optExpiry').value);
  const contracts = parseInt(document.getElementById('optContracts').value) || 0;
  const btn = document.getElementById('optExecBtn');
  const info = document.getElementById('optPremiumInfo');
  if(!ticker || !strike || strike <= 0){ btn.disabled = true; btn.textContent = 'Enter ticker and strike'; info.textContent=''; return; }
  const spot = await getPrice(ticker);
  if(!spot){ btn.disabled = true; btn.textContent = 'Could not find that ticker'; return; }
  info.textContent = 'Current price: $'+spot.toFixed(2)+' — calculating…';
  clearTimeout(showdownOptDebounce);
  showdownOptDebounce = setTimeout(async () => {
    const expDate = new Date(Date.now() + days*86400000).toISOString().split('T')[0];
    const {premium} = await getOptionPremium(ticker, spot, strike, expDate, showdownOptionType);
    const total = premium * 100 * contracts;
    info.textContent = `Current price: $${spot.toFixed(2)} — premium: $${premium.toFixed(2)}/share`;
    if(contracts <= 0){ btn.disabled = true; btn.textContent = 'Enter number of contracts'; return; }
    if(total > myEntry.cash){ btn.disabled = true; btn.textContent = 'Not enough cash'; return; }
    btn.disabled = false;
    btn.textContent = `Buy ${contracts} ${showdownOptionType==='call'?'Call':'Put'} — $${total.toFixed(2)}`;
  }, 300);
}
['optTicker','optStrike','optExpiry','optContracts'].forEach(id => {
  document.addEventListener('input', (e) => { if(e.target.id === id) updateShowdownOptionSummary(); });
});

async function executeShowdownOption(){
  const ticker = document.getElementById('optTicker').value.trim().toUpperCase();
  const strike = parseFloat(document.getElementById('optStrike').value);
  const days = parseInt(document.getElementById('optExpiry').value);
  const contracts = parseInt(document.getElementById('optContracts').value) || 0;
  if(!ticker || !strike || strike <= 0 || contracts <= 0) return;
  const spot = await getPrice(ticker);
  if(!spot) return;
  const expDate = new Date(Date.now() + days*86400000).toISOString().split('T')[0];
  const {premium} = await getOptionPremium(ticker, spot, strike, expDate, showdownOptionType);
  const total = premium * 100 * contracts;
  if(total > myEntry.cash){ showToast('Not enough cash for that trade.', 'error'); return; }

  const options = [...(myEntry.options || [])];
  options.push({
    id: 'opt_'+Date.now()+'_'+Math.random().toString(36).slice(2,7),
    symbol: ticker, type: showdownOptionType, strike, expirationDate: expDate, contracts,
    premiumPaid: premium, purchasedAt: new Date().toISOString(), status: 'open'
  });
  const cash = myEntry.cash - total;
  await sbPatch('bullpen_showdown_entries', 'id=eq.'+myEntry.id, {cash, options});
  myEntry.cash = cash;
  myEntry.options = options;
  showToast(`✅ Bought ${contracts} ${ticker} ${showdownOptionType} @ ${strike}`);
  document.getElementById('optStrike').value = '';
  await load();
}

// ── Dividends ──
// Same real-data pattern as trade.html: checks each held stock for a
// real dividend declared in the last 21 days, pays out shares held x
// dividend per share, and tracks paid dividends by symbol+ex-date so
// the same one can never be paid twice.
async function checkShowdownDividends(){
  const holdings = myEntry.holdings || {};
  const symbols = Object.keys(holdings).filter(s => holdings[s] > 0); // only long positions earn dividends, not shorts
  if(!symbols.length) return;
  const dividendsPaid = {...(myEntry.dividends_paid || {})};
  let cash = myEntry.cash;
  let anyPaid = false;
  const cutoff = Date.now() - 21*86400000;

  for(const symbol of symbols){
    let dividends;
    try{
      const res = await fetch(`${BACKEND}/api/history?symbol=${symbol}&range=1mo&interval=1d&events=div`);
      const data = await res.json();
      dividends = data?.chart?.result?.[0]?.events?.dividends;
    }catch(e){ continue; }
    if(!dividends) continue;

    for(const div of Object.values(dividends)){
      const exDateMs = div.date * 1000;
      if(exDateMs < cutoff || exDateMs > Date.now()) continue;
      const key = symbol + '_' + div.date;
      if(dividendsPaid[key]) continue;

      const payout = holdings[symbol] * div.amount;
      cash += payout;
      dividendsPaid[key] = true;
      anyPaid = true;
      showToast(`💰 Dividend: ${symbol} paid $${div.amount.toFixed(2)}/share × ${holdings[symbol]} = $${payout.toFixed(2)}`);
    }
  }

  if(anyPaid){
    await sbPatch('bullpen_showdown_entries', 'id=eq.'+myEntry.id, {cash, dividends_paid: dividendsPaid});
    myEntry.cash = cash;
    myEntry.dividends_paid = dividendsPaid;
    await load();
  }
}

async function checkShowdownOptionExpirations(){
  const options = myEntry.options || [];
  if(!options.length) return;
  let anySettled = false, cash = myEntry.cash;
  for(const o of options){
    if(o.status !== 'open') continue;
    if(new Date(o.expirationDate+'T16:00:00') > new Date()) continue;
    const spot = await getPrice(o.symbol).catch(()=>0);
    const intrinsic = o.type==='call' ? Math.max(0, spot-o.strike) : Math.max(0, o.strike-spot);
    const payout = intrinsic * 100 * o.contracts;
    cash += payout;
    o.status = 'expired';
    o.closedValue = intrinsic;
    anySettled = true;
    showToast(payout > 0 ? `📈 ${o.symbol} ${o.strike} ${o.type} expired in the money — $${payout.toFixed(2)} paid out` : `${o.symbol} ${o.strike} ${o.type} expired worthless`);
  }
  if(anySettled){
    await sbPatch('bullpen_showdown_entries', 'id=eq.'+myEntry.id, {cash, options});
    myEntry.cash = cash;
    await load();
  }
}

async function renderMyShowdownOptions(){
  const wrap = document.getElementById('myShowdownOptions');
  if(!wrap) return;
  const open = (myEntry.options || []).filter(o => o.status === 'open');
  if(!open.length){ wrap.innerHTML=''; return; }
  const rows = await Promise.all(open.map(async o => {
    const spot = await getPrice(o.symbol).catch(()=>0);
    const daysLeft = Math.max(0, (new Date(o.expirationDate+'T16:00:00') - Date.now()) / 86400000);
    const T = daysLeft / 365.25;
    const [r, sigma] = await Promise.all([getRiskFreeRate(), getHistoricalVolatility(o.symbol)]);
    const currentValue = spot ? blackScholes(spot, o.strike, T, r, sigma, o.type) : o.premiumPaid;
    const pnl = (currentValue - o.premiumPaid) * 100 * o.contracts;
    const cls = pnl >= 0 ? 'var(--green)' : 'var(--red)';
    return `<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px">
      <span>${o.symbol} ${o.strike} ${o.type.toUpperCase()} · ${o.contracts}x</span>
      <span style="color:${cls}">${pnl>=0?'+':''}$${pnl.toFixed(2)}</span>
    </div>`;
  }));
  wrap.innerHTML = `<h2 style="font-size:14px">My Options (${open.length})</h2>` + rows.join('');
}

let showdownOrderType = 'market';
function setShowdownOrderType(t){
  showdownOrderType = t;
  document.getElementById('showdownOrderTypeMarket').style.background = t === 'market' ? 'var(--bg3)' : 'transparent';
  document.getElementById('showdownOrderTypeMarket').style.borderColor = t === 'market' ? 'var(--green)' : 'var(--border)';

  document.getElementById('showdownLimitPriceRow').style.display = t === 'limit' ? 'block' : 'none';
}

async function doTrade(action){
  if(isPastEndDate()){ showToast('This showdown has ended — no more trading.', 'error'); setTimeout(()=>location.reload(), 1200); return; }
  const ticker = document.getElementById('tradeTicker').value.trim().toUpperCase();
  const shares = parseFloat(document.getElementById('tradeShares').value);
  if(!ticker || !shares || shares <= 0){ showToast('Enter a ticker and a positive number of shares.', 'error'); return; }

  if(showdownOrderType === 'limit'){
    const limitPrice = parseFloat(document.getElementById('showdownLimitPrice').value);
    if(!limitPrice || limitPrice <= 0){ showToast('Enter a limit price.', 'error'); return; }
    const orders = [...(myEntry.orders || [])];
    orders.push({id: 'ord_'+Date.now(), type: 'limit', side: action, ticker, shares, triggerPrice: limitPrice, createdAt: new Date().toISOString()});
    await sbPatch('bullpen_showdown_entries', 'id=eq.'+myEntry.id, {orders});
    myEntry.orders = orders;
    showToast(`Limit ${action} order placed: ${shares} ${ticker} @ $${limitPrice.toFixed(2)}`, 'success');
    renderShowdownPendingOrders();
    return;
  }

  const price = await getPrice(ticker);
  if(!price){ showToast('Could not get a price for that ticker.', 'error'); return; }
  const total = price * shares;
  const holdings = {...(myEntry.holdings || {})};
  let cash = myEntry.cash;

  if(action === 'buy'){
    const buyingPower = await getShowdownBuyingPower();
    if(total > buyingPower){ showToast(myEntry.margin_enabled ? 'Exceeds your buying power.' : 'Not enough cash for that trade.', 'error'); return; }
    holdings[ticker] = (holdings[ticker] || 0) + shares;
    cash -= total;
  } else {
    const currentHolding = holdings[ticker] || 0;
    const newHolding = currentHolding - shares;
    // Selling more than you own opens (or adds to) a short position —
    // the math already works correctly with negative share counts, so
    // this is the same formula either way, just with a risk cap on shorts.
    if(newHolding < 0){
      const shortExposure = Math.abs(newHolding) * price;
      if(shortExposure > myEntry.starting_cash * 2){
        showToast('That short position would be too large — capped at 2x your starting cash.', 'error');
        return;
      }
    }
    holdings[ticker] = newHolding;
    if(holdings[ticker] === 0) delete holdings[ticker];
    cash += total;
  }

  await sbPatch('bullpen_showdown_entries', 'id=eq.'+myEntry.id, {cash, holdings});
  await sbPost('bullpen_showdown_trades', {entry_id: myEntry.id, ticker, action, shares, price, total});
  trackEvent('showdown_trade', 'BullpenShowdown', action+'_'+ticker);
  showToast(`${action==='buy'?'Bought':'Sold'} ${shares} ${ticker} @ $${price.toFixed(2)}`, 'success');
  await load();
}
