<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bullpen Showdown | StockPilot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --green:#3fb27f;--green-d:#2f8f65;--red:#e8432b;--gold:#2979ff;--blue:#2979ff;
  --bg:#0b100c;--bg2:#0f1712;--bg3:#141d17;--border:rgba(242,237,224,0.14);
  --text:#f2ede0;--muted:#9a9686;--card:rgba(242,237,224,0.035);
}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:'IBM Plex Sans',sans-serif;min-height:100vh;padding-top:76px}

.bp-nav{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:16px 32px;background:rgba(8,12,16,0.9);backdrop-filter:blur(16px);border-bottom:1px solid var(--border)}
.bp-logo{display:flex;align-items:center;gap:10px;text-decoration:none}
.bp-logo-mark{width:36px;height:36px;border-radius:3px;background:linear-gradient(135deg,var(--blue),var(--green));display:flex;align-items:center;justify-content:center;font-family:'Anton',sans-serif;font-size:20px;color:#000}
.bp-logo-text{font-family:'Anton',sans-serif;font-size:22px;letter-spacing:2px;color:var(--text)}
.bp-logo-sub{font-size:10px;color:var(--muted);letter-spacing:1px;text-transform:uppercase;margin-top:2px}
.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--muted);padding:8px 18px;border-radius:3px;font-size:13px;cursor:pointer;font-family:'IBM Plex Sans',sans-serif}
.btn-ghost:hover{border-color:var(--blue);color:var(--blue)}

.wrap{max-width:960px;margin:0 auto;padding:24px 20px 80px}
.t-header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:24px}
.t-name{font-family:'Anton',sans-serif;font-size:32px;letter-spacing:1px}
.t-meta{font-size:13px;color:var(--muted);margin-top:2px}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--border);padding:6px 14px;border-radius:100px;font-size:12px;font-weight:600}
.pill.blue{border-color:rgba(41,121,255,0.4);color:var(--blue)}
.pill.gold{border-color:rgba(255,214,0,0.4);color:var(--gold)}
.pill.red{border-color:rgba(255,23,68,0.4);color:var(--red)}

.card{background:var(--card);border:1px solid var(--border);border-radius:4px;padding:22px;margin-bottom:20px}
.card h2{font-family:'Anton',sans-serif;font-size:20px;letter-spacing:0.5px;margin-bottom:16px}

.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px}
.stat-box{background:var(--bg3);border:1px solid var(--border);border-radius:3px;padding:16px;text-align:center}
.stat-box .v{font-family:'IBM Plex Mono',monospace;font-size:22px;font-weight:600}
.stat-box .l{font-size:11px;color:var(--muted);text-transform:uppercase;margin-top:4px}

.table-standings{width:100%;border-collapse:collapse}
.table-standings th{text-align:left;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;padding:8px;border-bottom:1px solid var(--border)}
.table-standings td{padding:12px 8px;border-bottom:1px solid var(--border);font-size:14px}
.table-standings tr.me{background:rgba(41,121,255,0.08)}
.rank-badge{width:24px;height:24px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;background:var(--bg3)}
.rank-badge.top3{background:rgba(255,214,0,0.15);color:var(--gold)}
.return-up{color:var(--green);font-weight:700}
.return-down{color:var(--red);font-weight:700}

.trade-row{display:grid;grid-template-columns:1fr 100px auto auto;gap:10px;margin-bottom:14px}
.trade-row input{background:var(--bg3);border:1px solid var(--border);border-radius:3px;padding:10px 12px;color:var(--text);font-size:14px;font-family:'IBM Plex Sans',sans-serif}
.trade-row input:focus{outline:none;border-color:var(--blue)}
.btn-buy{background:var(--green);border:none;color:#000;padding:10px 16px;border-radius:3px;font-weight:700;cursor:pointer;font-size:13px}
.btn-sell{background:var(--red);border:none;color:#fff;padding:10px 16px;border-radius:3px;font-weight:700;cursor:pointer;font-size:13px}
.quote-preview{font-size:12px;color:var(--muted);margin-bottom:14px;min-height:16px}
.pct-row{display:flex;gap:8px;margin-top:10px;align-items:center;flex-wrap:wrap}
.pct-btn{background:var(--bg3);border:1px solid var(--border);color:var(--text);padding:6px 14px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif}
.pct-btn:hover{border-color:var(--blue);color:var(--blue)}
.trade-feed-row{padding:9px 0;border-bottom:1px solid var(--border);font-size:13px}
.trade-feed-row:last-child{border-bottom:none}

.holding-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);font-size:14px}
.holding-row:last-child{border-bottom:none}

.empty-state{text-align:center;padding:60px 20px;color:var(--muted)}
.loading{text-align:center;padding:80px 20px;color:var(--muted)}
</style>
</head>
<body>

<nav class="bp-nav">
  <a href="/bullpen-showdown.html" class="bp-logo">
    <img src="/logo.jpg" alt="StockPilot" style="height:36px;width:36px;border-radius:3px;object-fit:cover"/>
    <div><div class="bp-logo-text">STOCKPILOT</div><div class="bp-logo-sub">Bullpen Showdown</div></div>
  </a>
  <div style="display:flex;align-items:center;gap:10px">
    <a href="/bullpen-showdown.html" class="btn-ghost" style="text-decoration:none">← All Showdowns</a>
    <a href="/my-account.html" class="btn-ghost" style="text-decoration:none">👤 My Account</a>
  </div>
</nav>

<div class="wrap" id="app">
  <div class="loading">Loading showdown...</div>
</div>

<script src="/bullpen-shared.js"></script>
<script>
const BACKEND = 'https://stockpilot-production-c94f.up.railway.app';
const params = new URLSearchParams(window.location.search);
const code = (params.get('code') || '').toUpperCase();
const token = localStorage.getItem('supabase_token');
const myUid = token ? JSON.parse(atob(token.split('.')[1])).sub : null;
const myName = localStorage.getItem('bshowdown_my_name') || localStorage.getItem('supabase_name') || '';

let tournament = null, entries = [], myEntry = null;
let priceCache = {};

async function getPrice(ticker){
  if(priceCache[ticker] !== undefined) return priceCache[ticker];
  try{
    const res = await fetch(`${BACKEND}/api/quotes?symbols=${ticker}`);
    const data = await res.json();
    const price = data?.quoteResponse?.result?.[0]?.regularMarketPrice || 0;
    priceCache[ticker] = price;
    return price;
  }catch(e){ return 0; }
}

function isPastEndDate(){
  return tournament.end_date <= new Date().toISOString().split('T')[0];
}

async function load(){
  if(!code){ document.getElementById('app').innerHTML = '<div class="empty-state">No showdown code given.</div>'; return; }
  const tourneys = await sbGet('bullpen_showdown_tournaments', 'code=eq.'+code);
  tournament = tourneys[0];
  if(!tournament){ document.getElementById('app').innerHTML = '<div class="empty-state">Showdown not found.</div>'; return; }

  entries = await sbGet('bullpen_showdown_entries', 'tournament_id=eq.'+tournament.id);
  myEntry = entries.find(e => (myUid && e.user_id === myUid) || e.nickname === myName) || null;

  if(tournament.status === 'completed' || isPastEndDate()) await renderCompleted();
  else await renderActive();
}

function isCommissioner(){
  return myEntry && (tournament.commissioner_name === myEntry.nickname);
}

async function computeLiveValues(){
  const withValues = [];
  for(const e of entries){
    let value = e.cash;
    for(const [ticker, shares] of Object.entries(e.holdings || {})){
      value += shares * await getPrice(ticker);
    }
    const pct = (value - e.starting_cash) / e.starting_cash * 100;
    withValues.push({...e, liveValue: value, livePct: pct});
  }
  withValues.sort((a,b) => b.livePct - a.livePct);
  return withValues;
}

async function renderActive(){
  const app = document.getElementById('app');
  if(!myEntry){
    app.innerHTML = `
      <div class="t-header">
        <div><div class="t-name">📈 ${tournament.name}</div><div class="t-meta">Code: ${tournament.code} · Ends ${tournament.end_date}</div></div>
      </div>
      <div class="card empty-state">You haven't joined this showdown yet. <a href="/bullpen-showdown.html" style="color:var(--blue)">Join with the code →</a></div>`;
    return;
  }

  const withValues = await computeLiveValues();
  const me = withValues.find(e => e.id === myEntry.id);
  const myRank = withValues.findIndex(e => e.id === myEntry.id) + 1;

  const daysLeft = Math.max(0, Math.ceil((new Date(tournament.end_date) - new Date()) / 86400000));

  const holdingsHtml = Object.entries(me.holdings || {}).length
    ? await Promise.all(Object.entries(me.holdings).map(async ([ticker, shares]) => {
        const price = await getPrice(ticker);
        const isShort = shares < 0;
        const label = isShort ? `${ticker} · SHORT ${Math.abs(shares)} sh` : `${ticker} · ${shares} sh`;
        return `<div class="holding-row"><span${isShort ? ' style="color:var(--red)"' : ''}>${label}</span><span style="color:${isShort?'var(--red)':'inherit'}">$${(shares*price).toFixed(2)}</span></div>`;
      }))
    : ['<div style="color:var(--muted);font-size:13px">No holdings yet</div>'];

  app.innerHTML = `
    <div class="t-header">
      <div><div class="t-name">📈 ${tournament.name}</div><div class="t-meta">Code: ${tournament.code} · ${entries.length} player${entries.length===1?'':'s'}</div></div>
      <span class="pill blue">Ends ${tournament.end_date}</span>
    </div>

    <div class="stat-grid">
      <div class="stat-box"><div class="v">$${me.cash.toLocaleString(undefined,{maximumFractionDigits:0})}</div><div class="l">Cash</div></div>
      <div class="stat-box"><div class="v" style="color:${me.livePct>=0?'var(--green)':'var(--red)'}">${me.livePct>=0?'+':''}${me.livePct.toFixed(2)}%</div><div class="l">Return</div></div>
      <div class="stat-box"><div class="v">${daysLeft}d</div><div class="l">Left</div></div>
    </div>

    <div class="card">
      <h2>🏆 Leaderboard</h2>
      <table class="table-standings">
        <thead><tr><th>#</th><th>Player</th><th style="text-align:right">Return</th></tr></thead>
        <tbody>
          ${withValues.map((e,i) => `
            <tr class="${myEntry.id===e.id?'me':''}">
              <td><span class="rank-badge ${i<3?'top3':''}">${i+1}</span></td>
              <td>${escapeHtml(e.nickname)}${myEntry.id===e.id?' (you)':''}</td>
              <td style="text-align:right" class="${e.livePct>=0?'return-up':'return-down'}">${e.livePct>=0?'+':''}${e.livePct.toFixed(2)}%</td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    </div>

    <div class="card">
      <h2>💹 Trade</h2>
      <input type="text" id="tradeTicker" placeholder="Ticker, e.g. AAPL" style="text-transform:uppercase;width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:10px 12px;color:var(--text);font-size:14px;font-family:'DM Sans',sans-serif;margin-bottom:10px">
      <div id="tickerInfo"></div>
      <div class="trade-row" style="grid-template-columns:1fr auto auto">
        <input type="number" id="tradeShares" placeholder="Shares" min="1">
        <button class="btn-buy" onclick="doTrade('buy')">Buy</button>
        <button class="btn-sell" onclick="doTrade('sell')">Sell</button>
      </div>
      <div class="pct-row">
        <button class="pct-btn" onclick="setPct(25)">25%</button>
        <button class="pct-btn" onclick="setPct(50)">50%</button>
        <button class="pct-btn" onclick="setPct(100)">100%</button>
        <span style="font-size:11px;color:var(--muted);align-self:center;margin-left:4px">of buying power</span>
      </div>
      <div style="font-size:11px;color:var(--muted);margin:10px 0 14px">Sell more than you own to open a short position.</div>
      <h2 style="font-size:15px;margin-top:4px">Your Holdings</h2>
      ${holdingsHtml.join('')}
    </div>

    <div class="card">
      <h2>📜 Recent Trades</h2>
      <div id="recentTradesFeed"><div style="color:var(--muted);font-size:13px">Loading...</div></div>
    </div>
  `;

  document.getElementById('tradeTicker').addEventListener('blur', updateQuotePreview);
  loadRecentTrades();
}

async function getHistory(ticker){
  try{
    const res = await fetch(`${BACKEND}/api/history?symbol=${ticker}&range=5d&interval=1d`);
    const data = await res.json();
    const result = data?.chart?.result?.[0];
    return (result?.indicators?.quote?.[0]?.close || []).filter(c => c != null);
  }catch(e){ return []; }
}

function sparklineSvg(closes){
  if(closes.length < 2) return '';
  const width=110, height=32;
  const min = Math.min(...closes), max = Math.max(...closes);
  const range = (max - min) || 1;
  const points = closes.map((c,i) => {
    const x = (i/(closes.length-1)) * width;
    const y = height - ((c-min)/range) * height;
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(' ');
  const up = closes[closes.length-1] >= closes[0];
  const color = up ? 'var(--green)' : 'var(--red)';
  return `<svg width="${width}" height="${height}" viewBox="0 0 ${width} ${height}"><polyline points="${points}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></svg>`;
}

async function updateQuotePreview(){
  const ticker = document.getElementById('tradeTicker').value.trim().toUpperCase();
  const infoEl = document.getElementById('tickerInfo');
  if(!infoEl) return;
  if(!ticker){ infoEl.innerHTML = ''; return; }
  infoEl.innerHTML = '<div style="color:var(--muted);font-size:12px;margin-bottom:10px">Loading...</div>';
  const [price, closes] = await Promise.all([getPrice(ticker), getHistory(ticker)]);
  if(!price){ infoEl.innerHTML = '<div style="color:var(--red);font-size:12px;margin-bottom:10px">Ticker not found</div>'; return; }
  const dayChange = closes.length>=2 ? ((closes[closes.length-1]-closes[closes.length-2])/closes[closes.length-2]*100) : null;
  infoEl.innerHTML = `
    <div style="display:flex;align-items:center;justify-content:space-between;background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:10px 14px;margin-bottom:12px">
      <div>
        <div style="font-weight:700;font-size:15px">${ticker}</div>
        <div style="font-family:'IBM Plex Mono',monospace;font-size:13px">$${price.toFixed(2)}${dayChange!==null?` <span style="color:${dayChange>=0?'var(--green)':'var(--red)'}">${dayChange>=0?'▲':'▼'} ${Math.abs(dayChange).toFixed(2)}%</span>`:''}</div>
      </div>
      ${sparklineSvg(closes)}
    </div>`;
}

async function setPct(pct){
  const ticker = document.getElementById('tradeTicker').value.trim().toUpperCase();
  if(!ticker){ showToast('Enter a ticker first.', 'error'); return; }
  const price = await getPrice(ticker);
  if(!price){ showToast('Could not get a price for that ticker.', 'error'); return; }
  const shares = Math.max(1, Math.floor((myEntry.cash * pct/100) / price));
  document.getElementById('tradeShares').value = shares;
}

async function loadRecentTrades(){
  const feed = document.getElementById('recentTradesFeed');
  if(!feed) return;
  const entryIds = entries.map(e=>e.id);
  if(!entryIds.length){ feed.innerHTML = '<div style="color:var(--muted);font-size:13px">No trades yet.</div>'; return; }
  const trades = await sbGet('bullpen_showdown_trades', 'entry_id=in.('+entryIds.join(',')+')&order=created_at.desc&limit=15');
  if(!trades.length){ feed.innerHTML = '<div style="color:var(--muted);font-size:13px">No trades yet.</div>'; return; }
  feed.innerHTML = trades.map(t => {
    const entry = entries.find(e=>e.id===t.entry_id);
    const name = entry ? entry.nickname : '?';
    const time = new Date(t.created_at).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
    const color = t.action==='buy' ? 'var(--green)' : 'var(--red)';
    return `<div class="trade-feed-row"><span style="color:${color};font-weight:700;text-transform:uppercase;font-size:11px;width:36px;display:inline-block">${t.action}</span><strong>${escapeHtml(t.ticker)}</strong> <span style="color:var(--muted)">${t.shares} sh @ $${t.price.toFixed(2)}</span><span style="color:var(--muted);float:right">${escapeHtml(name)} · ${time}</span></div>`;
  }).join('');
}

function showToast(msg, type){
  let container = document.getElementById('toastContainer');
  if(!container){
    container = document.createElement('div');
    container.id = 'toastContainer';
    container.style.cssText = 'position:fixed;bottom:20px;right:20px;z-index:2000;display:flex;flex-direction:column;gap:8px;align-items:flex-end;max-width:90vw';
    document.body.appendChild(container);
  }
  const color = type==='error' ? 'var(--red)' : 'var(--green)';
  const toast = document.createElement('div');
  toast.style.cssText = `background:var(--bg2);border:1px solid ${color};color:${color};padding:12px 18px;border-radius:10px;font-size:14px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,0.4);opacity:0;transform:translateY(8px);transition:all 0.25s;max-width:320px`;
  toast.textContent = msg;
  container.appendChild(toast);
  requestAnimationFrame(()=>{ toast.style.opacity='1'; toast.style.transform='translateY(0)'; });
  setTimeout(()=>{
    toast.style.opacity='0'; toast.style.transform='translateY(8px)';
    setTimeout(()=>toast.remove(), 300);
  }, 3200);
}

async function doTrade(action){
  if(isPastEndDate()){ showToast('This showdown has ended — no more trading.', 'error'); setTimeout(()=>location.reload(), 1200); return; }
  const ticker = document.getElementById('tradeTicker').value.trim().toUpperCase();
  const shares = parseFloat(document.getElementById('tradeShares').value);
  if(!ticker || !shares || shares <= 0){ showToast('Enter a ticker and a positive number of shares.', 'error'); return; }

  const price = await getPrice(ticker);
  if(!price){ showToast('Could not get a price for that ticker.', 'error'); return; }
  const total = price * shares;
  const holdings = {...(myEntry.holdings || {})};
  let cash = myEntry.cash;

  if(action === 'buy'){
    if(total > cash){ showToast('Not enough cash for that trade.', 'error'); return; }
    holdings[ticker] = (holdings[ticker] || 0) + shares;
    cash -= total;
  } else {
    const currentHolding = holdings[ticker] || 0;
    const newHolding = currentHolding - shares;
    // Selling more than you own opens (or adds to) a short position —
    // the math already works correctly with negative share counts, so
    // this is the same formula either way, just with a risk cap on shorts.
    if(newHolding < 0){
      const shortExposure = Math.abs(newHolding) * price;
      if(shortExposure > myEntry.starting_cash * 2){
        showToast('That short position would be too large — capped at 2x your starting cash.', 'error');
        return;
      }
    }
    holdings[ticker] = newHolding;
    if(holdings[ticker] === 0) delete holdings[ticker];
    cash += total;
  }

  await sbPatch('bullpen_showdown_entries', 'id=eq.'+myEntry.id, {cash, holdings});
  await sbPost('bullpen_showdown_trades', {entry_id: myEntry.id, ticker, action, shares, price, total});
  trackEvent('showdown_trade', 'BullpenShowdown', action+'_'+ticker);
  showToast(`${action==='buy'?'Bought':'Sold'} ${shares} ${ticker} @ $${price.toFixed(2)}`, 'success');
  await load();
}

async function renderCompleted(){
  const app = document.getElementById('app');
  const withValues = await computeLiveValues();
  const champ = withValues[0];

  app.innerHTML = `
    <div class="t-header">
      <div><div class="t-name">📈 ${tournament.name}</div><div class="t-meta">Code: ${tournament.code}</div></div>
      <span class="pill gold">🏆 Complete</span>
    </div>

    <div class="card" style="text-align:center;padding:40px 20px">
      <div style="font-size:48px;margin-bottom:10px">🏆</div>
      <div style="font-family:'Anton',sans-serif;font-size:28px;letter-spacing:1px">${champ ? escapeHtml(champ.nickname) : 'No one played'}</div>
      ${champ ? `<div style="color:${champ.livePct>=0?'var(--green)':'var(--red)'};font-weight:700;margin-top:6px">${champ.livePct>=0?'+':''}${champ.livePct.toFixed(2)}%</div>` : ''}
    </div>

    <div class="card">
      <h2>Final Standings</h2>
      <table class="table-standings">
        <thead><tr><th>#</th><th>Player</th><th style="text-align:right">Return</th></tr></thead>
        <tbody>
          ${withValues.map((e,i) => `
            <tr class="${myEntry && myEntry.id===e.id?'me':''}">
              <td><span class="rank-badge ${i<3?'top3':''}">${i+1}</span></td>
              <td>${escapeHtml(e.nickname)}${myEntry && myEntry.id===e.id?' (you)':''}</td>
              <td style="text-align:right" class="${e.livePct>=0?'return-up':'return-down'}">${e.livePct>=0?'+':''}${e.livePct.toFixed(2)}%</td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    </div>
  `;

  if(tournament.status !== 'completed'){
    await sbPatch('bullpen_showdown_tournaments', 'id=eq.'+tournament.id, {status: 'completed'});
  }
}

load();
</script>
</body>
</html>
